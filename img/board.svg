<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100">
  <!-- The big board behind everything: last lesson's chalk, half wiped off. Tiles seamlessly enough at this size. -->
  <defs>
    <filter id="wipe" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>

  <!-- eraser swipes: wide, soft arcs where the board was wiped -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" filter="url(#wipe)">
    <path d="M40 210 C 260 120, 520 140, 760 230" stroke-width="120" opacity=".035"/>
    <path d="M880 120 C 1050 60, 1250 90, 1380 170" stroke-width="90" opacity=".03"/>
    <path d="M120 760 C 380 660, 640 700, 900 800 S 1250 880, 1360 820" stroke-width="140" opacity=".03"/>
    <path d="M1000 520 C 1120 470, 1260 500, 1340 560" stroke-width="80" opacity=".028"/>
  </g>

  <!-- ghosts of earlier lessons, nearly erased -->
  <g fill="none" stroke="#efeee6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".055" filter="url(#soft)">
    <!-- a bézier curve with its handles (Inkscape) -->
    <path d="M980 360 C 1030 250, 1160 250, 1210 360"/>
    <path d="M980 360 L 1010 268 M1210 360 L 1180 268" stroke-dasharray="6 9"/>
    <rect x="973" y="353" width="14" height="14"/><rect x="1203" y="353" width="14" height="14"/>
    <circle cx="1010" cy="266" r="6"/><circle cx="1180" cy="266" r="6"/>
    <!-- a little table sketch (SQL) -->
    <rect x="150" y="430" width="190" height="120" rx="3"/>
    <path d="M150 470 H340 M150 510 H340 M215 430 V550"/>
    <!-- an arrow from one thing to another -->
    <path d="M380 490 C 430 470, 470 470, 520 500 M505 486 L 522 501 L 500 510"/>
    <!-- box model squares (CSS) -->
    <rect x="620" y="940" width="170" height="110" rx="3" stroke-dasharray="8 8"/>
    <rect x="650" y="962" width="110" height="66" rx="2"/>
    <!-- a tick and a circled number, like a marked exercise -->
    <path d="M1250 980 l 14 16 l 30 -38"/>
    <circle cx="70" cy="1010" r="22"/>
  </g>
  <g fill="#efeee6" opacity=".05" filter="url(#soft)" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-weight="700">
    <text x="560" y="420" font-size="40" transform="rotate(-4 560 420)">SELECT * FROM</text>
    <text x="90" y="300" font-size="34" transform="rotate(3 90 300)">&lt;h1&gt;Szia!&lt;/h1&gt;</text>
    <text x="1040" y="700" font-size="36" transform="rotate(-6 1040 700)">a² + b² = c²</text>
    <text x="360" y="1080" font-size="30" transform="rotate(2 360 1080)">WHERE kor &gt; 18</text>
    <text x="1110" y="900" font-size="30">h.f. 42/3</text>
  </g>

  <!-- chalk dust settling -->
  <g fill="#ffffff" opacity=".07">
    <circle cx="210" cy="90" r="1.6"/><circle cx="640" cy="560" r="1.2"/><circle cx="905" cy="430" r="1.8"/>
    <circle cx="1290" cy="300" r="1.3"/><circle cx="480" cy="850" r="1.5"/><circle cx="60" cy="640" r="1.2"/>
    <circle cx="1180" cy="1060" r="1.6"/><circle cx="820" cy="60" r="1.1"/>
  </g>
</svg>
