<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>/* moving between pages: the old page drifts aside and fades, the new one glides in; the rail holds still */@view-transition{navigation:auto}.rail{view-transition-name:rail}::view-transition-group(root){animation:none}::view-transition-old(root){animation:dk-out .2s cubic-bezier(.4,0,1,1) both}::view-transition-new(root){animation:dk-in .38s cubic-bezier(.16,1,.3,1) .06s both}::view-transition-old(rail),::view-transition-new(rail){animation:none}@keyframes dk-out{to{opacity:0;transform:translateX(-18px)}}@keyframes dk-in{from{opacity:0;transform:translateX(26px)}}@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}</style>
<title>The Djinn's Fourteen Riddles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* The Djinn's riddles: query-writing practice. A giant djinn (head, shoulders, chest) fills the screen behind the
   task card and is always alive: breathing, smoke rising off him, burning eyes, glowing runes on his chest.
   He flares up when he asks, recoils when a query is right, laughs when it's wrong, and finally burns away. */
:root{
  --night:#05040c; --ink:#ece6ff; --muted:#a49cc4; --gold:#e9b949; --gold-2:#ffe39a;
  --card:rgba(12,9,26,.93); --card-line:rgba(233,185,73,.38); --field:#07060f;
  --good:#3ecf8e; --good-bg:rgba(30,120,80,.22); --bad:#ff6d6d; --bad-bg:rgba(150,30,40,.26); --part:#ffc35a; --part-bg:rgba(150,100,10,.22);
  --f-body:"Atkinson Hyperlegible", system-ui, sans-serif; --f-disp:"Cinzel", Georgia, serif; --f-mono:"JetBrains Mono", ui-monospace, monospace;
  --power:1;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--night)}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.55 var(--f-body);background:var(--night)}
a{color:inherit}
code,pre,textarea{font-family:var(--f-mono)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}

/* ---------- the stage: fixed behind everything ---------- */
.stage{position:fixed;inset:0;overflow:hidden;z-index:0;background:radial-gradient(70vmax 50vmax at 50% 20%, #1c1240 0%, #0b0820 45%, #05040c 80%)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120vmax 90vmax at 50% 35%, transparent 40%, rgba(0,0,0,.75) 85%);z-index:3}
.stage.rage::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(80vmax 60vmax at 50% 30%, transparent 30%, rgba(170,0,0,.45));animation:rage 1.4s ease-out forwards}
@keyframes rage{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.backglow{position:absolute;left:50%;top:22%;width:min(130vw,1300px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:0;
  background:radial-gradient(circle, rgba(255,90,20,calc(.22*var(--power))) 0%, rgba(110,40,200,calc(.25*var(--power))) 35%, transparent 65%);animation:glow 6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(.95)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}
.rays{position:absolute;left:50%;top:26%;width:220vmax;height:220vmax;transform:translate(-50%,-50%) scale(.2);z-index:1;opacity:0;pointer-events:none;border-radius:50%;
  background:repeating-conic-gradient(from 0deg, rgba(255,227,154,.5) 0deg 6deg, rgba(255,227,154,0) 6deg 17deg);
  -webkit-mask:radial-gradient(circle, #000 0%, rgba(0,0,0,.5) 28%, transparent 60%);mask:radial-gradient(circle, #000 0%, rgba(0,0,0,.5) 28%, transparent 60%)}
.stage.freed .rays{opacity:1;transform:translate(-50%,-50%) scale(1);transition:opacity 1.4s, transform 2s cubic-bezier(.2,.8,.2,1);animation:raySpin 30s linear infinite}
@keyframes raySpin{to{rotate:360deg}}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}

#djinn{position:absolute;left:50%;top:-12.5vh;width:min(1400px,168vw,140vh);height:auto;transform:translateX(-50%);z-index:2;overflow:visible}
@media (max-width:759px),(max-height:619px){#djinn{top:-4vh;width:max(168vw,560px)}}

/* idle life */
#giant{transform-box:view-box;transform-origin:500px 900px;animation:breathe 6s ease-in-out infinite;transition:opacity 2.2s, filter 2.2s}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.012)}}
#head{transform-box:view-box;transform-origin:500px 430px;transition:transform 1.2s cubic-bezier(.3,.7,.3,1)}
#headIdle{transform-box:view-box;transform-origin:500px 430px;animation:headIdle 11s ease-in-out infinite;transition:translate .8s ease-out}
@keyframes headIdle{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.4deg)}60%{transform:rotate(1.1deg)}}
#eyes{transform-box:fill-box;transform-origin:center;animation:blink 9s infinite;transition:translate .5s ease-out}
@keyframes blink{0%,96%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.1)}}
#eyeGlow{animation:eyePulse 3.2s ease-in-out infinite}
@keyframes eyePulse{0%,100%{opacity:.6}50%{opacity:1}}
#runes{animation:runes 4.5s ease-in-out infinite}
@keyframes runes{0%,100%{opacity:.35}50%{opacity:.95}}
#gem{animation:eyePulse 2.4s ease-in-out infinite}
.mouth{opacity:0;transition:opacity .12s}
#mStern{opacity:1}
#cracks path{stroke-dasharray:900;stroke-dashoffset:900}

#djinn.dormant #giant{filter:brightness(.4) saturate(.6)}
#djinn.dormant #eyes,#djinn.dormant #eyeGlow,#djinn.dormant #runes{opacity:0;animation:none}
#djinn.waking #giant{transition:filter 1.6s}
#djinn.ask #head{transform:scale(1.035) translateY(6px)}
#djinn.ask #eyeGlow,#djinn.ask #runes{animation:flare 1.3s ease-out}
@keyframes flare{0%{opacity:1}25%{opacity:1;filter:brightness(2.2)}100%{opacity:.7}}
.stage.rumble #djinn{animation:rumble .5s linear}
@keyframes rumble{0%,100%{transform:translateX(-50%)}20%{transform:translateX(calc(-50% - 4px)) translateY(2px)}40%{transform:translateX(calc(-50% + 4px))}60%{transform:translateX(calc(-50% - 3px)) translateY(-1px)}80%{transform:translateX(calc(-50% + 2px))}}
#djinn.hurt #giant{animation:flash .8s ease-out}
@keyframes flash{0%{filter:brightness(2.6) saturate(.2)}100%{filter:none}}
#djinn.hurt #head{transform:rotate(-3deg) translateY(-14px) scale(.98)}
#djinn.hurt #eyes{animation:flicker .8s steps(2) 1}
@keyframes flicker{0%,40%,80%{opacity:.15}20%,60%,100%{opacity:1}}
#djinn.hurt #mStern,#djinn.laugh #mStern,#djinn.dying #mStern{opacity:0}
#djinn.hurt #mClench,#djinn.dying #mClench{opacity:1}
#djinn.laugh #mLaugh{opacity:1}
#djinn.laugh #head{transform:rotate(2deg) translateY(-12px) scale(1.02)}
#djinn.laugh #body{animation:shake .26s ease-in-out 5}
@keyframes shake{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#djinn.laugh #eyeGlow{opacity:1;filter:hue-rotate(-18deg) brightness(1.4)}
#djinn.dying #cracks path{stroke-dashoffset:0;transition:stroke-dashoffset 1.8s ease-in}
#djinn.dying #giant{animation:dyingShake .1s linear infinite}
@keyframes dyingShake{0%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}100%{transform:translate(-3px,1px)}}
#djinn.dying #eyes path{fill:#fff}
#djinn.dying #eyeGlow{filter:brightness(2.5)}
#djinn.gone #giant{opacity:0;filter:blur(18px) brightness(3);transform:scale(1.08) translateY(-40px);animation:none}

/* speech */
.bubble{position:fixed;z-index:6;left:calc(50% + 235px);top:12vh;width:min(340px,calc(50vw - 260px));background:rgba(10,6,24,.84);border:1.5px solid rgba(233,185,73,.55);
  border-radius:14px;padding:12px 16px;box-shadow:0 12px 40px rgba(0,0,0,.6), inset 0 0 30px rgba(120,40,200,.25);
  font:700 clamp(15px,1.5vw,18px)/1.42 var(--f-disp);color:var(--gold-2);transition:opacity .3s}
.bubble.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.75);opacity:0}100%{transform:scale(1);opacity:1}}
.bubble.hide{opacity:0;pointer-events:none}
.bubble.bad{border-color:rgba(255,80,40,.8);color:#ffb59a}
.bubble.good{border-color:rgba(90,220,160,.75);color:#c7f5df}
.bubble::before{content:"";position:absolute;left:-13px;top:26px;border:13px solid transparent;border-right-color:rgba(233,185,73,.55);border-left:0}
@media (max-width:1000px){.bubble{left:50%;transform:translateX(-50%);top:46px;width:min(94vw,460px);text-align:center;font-size:15px;padding:9px 14px}
  .bubble.pop{animation:popC .45s cubic-bezier(.3,1.6,.5,1)} @keyframes popC{0%{transform:translateX(-50%) scale(.75);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
  .bubble::before{display:none}}
.finale{position:fixed;z-index:6;left:50%;top:22vh;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:94%}
.finale h2{margin:0;font:900 clamp(30px,6vw,72px)/1.05 var(--f-disp);color:#fff4c8;letter-spacing:.05em;text-shadow:0 0 18px rgba(255,200,90,.9), 0 0 60px rgba(255,130,30,.7)}
.finale h2 span{display:inline-block;opacity:0;transform:translateY(40px) scale(.3);animation:letter .8s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes letter{to{opacity:1;transform:none}}
.finale p{margin:12px 0 0;font:700 clamp(15px,2vw,20px) var(--f-body);color:#ffe7b0;opacity:0;animation:fadeUp .9s 1.3s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- foreground ---------- */
.topline{position:relative;z-index:7;display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-left));font-size:14px;color:var(--muted)}
.crumb a{text-decoration:none}.crumb a:hover{color:#fff;text-decoration:underline}
.langlink{margin-left:auto;font:700 14px var(--f-body);color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:4px;padding:4px 10px;text-decoration:none;background:rgba(0,0,0,.35)}
.panel{position:fixed;z-index:5;left:50%;top:47vh;bottom:12px;transform:translateX(-50%);width:min(820px,94vw);overflow:auto;overscroll-behavior:contain;
  padding:0 0 12px;scrollbar-width:thin;scrollbar-color:rgba(233,185,73,.4) transparent;border-radius:16px}
@media (max-width:759px),(max-height:619px){.panel{position:relative;left:auto;top:auto;bottom:auto;transform:none;width:auto;overflow:visible;padding:calc(42vh - 46px) 12px 110px}}
.card{max-width:820px;margin:0 auto;background:var(--card);border:1.5px solid var(--card-line);border-radius:16px;padding:20px 22px 22px;
  box-shadow:0 30px 80px rgba(0,0,0,.7), 0 0 60px rgba(120,40,200,.18);backdrop-filter:blur(6px)}
.card h1{font:900 clamp(26px,3.6vw,40px)/1.1 var(--f-disp);margin:0 0 8px;color:var(--gold-2);letter-spacing:.02em}
.kicker{font:700 12.5px var(--f-disp);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.story p{margin:.5em 0}
.rules{padding-left:20px;margin:10px 0 16px;color:#d6cdf3}
.rules li{margin:4px 0}
label.nm{display:block;font-weight:700;margin:10px 0 6px}
input.nm{width:100%;max-width:380px;font:inherit;padding:10px 12px;border:1.5px solid rgba(233,185,73,.5);border-radius:8px;background:var(--field);color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:10px 18px;font:700 16px var(--f-body);background:#2a1d55;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(200,180,255,.35)}
.btn:hover{filter:brightness(1.2)}
.btn:active{transform:translateY(1px)}
.btn.gold{background:linear-gradient(#ffd877,#d9a02a);color:#241500;box-shadow:0 3px 0 #7a4c08}
.btn.big{font-size:18px;padding:13px 24px}
.btn.ghost{background:transparent;color:#e3dbff}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qno{font:900 15px var(--f-disp);color:var(--gold);letter-spacing:.06em}
.chip{font:700 12.5px var(--f-body);background:rgba(120,80,230,.25);color:#d9ccff;border-radius:999px;padding:3px 10px}
.qnav{margin-left:auto;display:flex;gap:6px}
.qnav button{width:34px;height:34px;border-radius:8px;border:1.5px solid rgba(200,180,255,.3);background:rgba(0,0,0,.3);color:#e3dbff;font-weight:700}
.qnav button[disabled]{opacity:.3}
.seals{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px}
.seal{width:26px;height:26px;border:0;padding:0;position:relative;background:none;color:#8a80ad;font:700 11px var(--f-mono)}
.seal::before{content:"";position:absolute;inset:3px;transform:rotate(45deg);border:1.5px solid #4a3f7a;background:#0d0a1d;border-radius:3px;transition:all .4s}
.seal span{position:relative}
.seal.first::before{background:radial-gradient(#fff3b8,#e9b949 60%,#a06a08);border-color:#ffe9a0;box-shadow:0 0 12px rgba(255,210,100,.85)}
.seal.first{color:#2e1d00}
.seal.later::before{background:radial-gradient(#fff,#c4cde2 60%,#7480a0);border-color:#eef3ff;box-shadow:0 0 9px rgba(200,215,255,.55)}
.seal.later{color:#1b2238}
.seal.rev::before{background:#4a3018;border-color:#8f6430}
.seal.rev{color:#f0d3a2}
.seal.cur::before{border-color:var(--gold);box-shadow:0 0 0 3px rgba(233,185,73,.28)}
.seal.ignite::before{animation:ignite .9s ease-out}
@keyframes ignite{0%{transform:rotate(45deg) scale(1)}35%{transform:rotate(225deg) scale(1.9);filter:brightness(2.2)}100%{transform:rotate(405deg) scale(1)}}
.qtext{font:700 19px/1.42 var(--f-body);margin:4px 0 12px;color:#fff}
details.schema{background:rgba(0,0,0,.28);border:1px solid rgba(233,185,73,.22);border-radius:10px;padding:8px 12px;margin:0 0 14px}
details.schema summary{cursor:pointer;font-weight:700;color:var(--gold-2)}
.sch{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px}
.st{background:rgba(255,255,255,.035);border:1px solid rgba(200,180,255,.15);border-radius:8px;padding:6px 9px}
.st h5{margin:0 0 4px;font:700 14px var(--f-mono);color:var(--gold-2)}
.st div{font-size:13px;line-height:1.35;margin:3px 0;color:#cfc6ec}
.st b{font:700 13px var(--f-mono);color:#fff}
.st .fk b{color:#7fe3ff}
.st .k{color:var(--gold)}
.lk{margin-top:8px;font-size:13.5px;color:#cfc6ec;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.lk code{color:#7fe3ff}
.lk .allrows{margin-left:auto;background:none;border:0;color:var(--gold-2);text-decoration:underline;font-size:13px;padding:0}
details.remind{background:rgba(110,70,220,.14);border-left:3px solid #7a52e6;border-radius:8px;padding:8px 12px;margin:0 0 14px;color:#ddd3ff}
details.remind summary{cursor:pointer;font-weight:700;color:#c7b4ff}
details.remind p{margin:.4em 0}
details.remind pre{background:rgba(0,0,0,.35);padding:8px 10px;border-radius:6px;font-size:14px;overflow:auto}
code{background:rgba(255,255,255,.08);padding:0 4px;border-radius:4px;font-size:.92em;color:#ffe8b8}
.sqlbox textarea{width:100%;min-height:170px;font-size:15.5px;line-height:1.55;padding:12px 14px;border-radius:10px;border:1.5px solid rgba(233,185,73,.4);background:var(--field);color:#f4efff;resize:vertical;caret-color:var(--gold)}
.sqlbox textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(233,185,73,.2)}
.row{display:flex;align-items:center;gap:10px;margin:10px 0 0;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted)}
.out{margin-top:10px}
.out .meta{font:700 13px var(--f-mono);color:var(--muted);margin:6px 0}
.out .err{background:var(--bad-bg);color:#ffc6c6;border-radius:8px;padding:8px 10px;font:14px var(--f-mono)}
.tbl{overflow:auto;max-height:300px;border:1px solid rgba(200,180,255,.2);border-radius:8px;background:rgba(0,0,0,.35)}
.tbl table{border-collapse:collapse;width:100%;font:14px var(--f-mono)}
.tbl th{position:sticky;top:0;background:#1d1540;text-align:left;padding:5px 8px;color:var(--gold-2)}
.tbl td{padding:4px 8px;border-top:1px solid rgba(255,255,255,.06);white-space:nowrap}
.tbl td.n{text-align:right}
.tbl td.null{color:#8f84b8;font-style:italic}
.fb{margin-top:12px;border-radius:10px;font-size:16px}
.fb:empty{display:none}
.fb.ok{background:var(--good-bg);color:#c9f7df;padding:10px 14px;border-left:4px solid var(--good)}
.fb.bad{background:var(--bad-bg);color:#ffd6d6;padding:10px 14px;border-left:4px solid var(--bad);animation:nudge .4s}
.fb.part{background:var(--part-bg);color:#ffe7b5;padding:10px 14px;border-left:4px solid var(--part)}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb p{margin:.4em 0 0}
.fb pre{background:rgba(0,0,0,.35);padding:8px 10px;border-radius:6px;font-size:14px;overflow:auto;margin:6px 0 0;color:#fff2cf;white-space:pre-wrap}
.locked textarea{opacity:.75}
.foot{max-width:820px;margin:12px auto 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.foot .grow{flex:1}
.foot .btn{background:rgba(10,6,24,.8)}
dialog#tables{border:1.5px solid var(--card-line);border-radius:14px;padding:0;max-width:min(1000px,96vw);width:96vw;max-height:88vh;background:#0e0a20;color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.7)}
dialog#tables::backdrop{background:rgba(3,2,10,.75);backdrop-filter:blur(3px)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;background:#0e0a20;z-index:1}
.dlg-head h2{margin:0;font:900 20px var(--f-disp);color:var(--gold-2)}
.dlg-head .btn{margin-left:auto}
.dlg-body{padding:14px 18px 20px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.dt h4{margin:0 0 6px;font:700 15px var(--f-mono);color:var(--gold-2);display:flex;justify-content:space-between}
.dt h4 span{font:400 13px var(--f-body);color:var(--muted)}
.result .big{font:900 clamp(46px,8vw,76px)/1 var(--f-disp);color:var(--gold-2);text-align:center;text-shadow:0 0 30px rgba(255,180,60,.4)}
.result .sub{text-align:center;color:var(--muted);margin:6px 0 14px}
.sumtbl{width:100%;border-collapse:collapse;margin:8px 0 16px}
.sumtbl td,.sumtbl th{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
.sumtbl td.n{text-align:right;font-family:var(--f-mono)}
.export h3{font:900 18px var(--f-disp);color:var(--gold-2);margin:14px 0 6px}
.export ol{padding-left:20px;margin:6px 0 12px}
.err{background:var(--bad-bg);color:#ffd6d6;border-radius:10px;padding:14px}
@media (prefers-reduced-motion:reduce){
  #giant,#headIdle,#eyes,#runes,.backglow,#gem{animation:none!important}
  .stage.rumble #djinn,#djinn.laugh #body,#djinn.dying #giant,#djinn.hurt #giant{animation:none!important}
  .stage.freed .rays{animation:none}
}
</style>
</head>
<body>
<div class="stage" id="stage" aria-hidden="true">
  <div class="backglow"></div>
  <div class="rays"></div>
  <svg id="djinn" class="dormant" viewBox="0 0 1000 900">
    <defs>
      <linearGradient id="gSkin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34407e"/><stop offset=".45" stop-color="#1d2552"/><stop offset="1" stop-color="#0a0d24"/></linearGradient>
      <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#03040d" stop-opacity=".85"/><stop offset=".28" stop-color="#03040d" stop-opacity="0"/><stop offset=".72" stop-color="#03040d" stop-opacity="0"/><stop offset="1" stop-color="#03040d" stop-opacity=".85"/></linearGradient>

<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-asm.js"></script>
<script>
const CFG = {"lang": "en", "key": "djinn-en-v2", "seed": "CREATE TABLE chambers (id INTEGER PRIMARY KEY, name TEXT, depth INTEGER);\nCREATE TABLE treasures (id INTEGER PRIMARY KEY, name TEXT, kind TEXT, value INTEGER, chamber_id INTEGER);\nCREATE TABLE curses (id INTEGER PRIMARY KEY, treasure_id INTEGER, name TEXT, power INTEGER);\nINSERT INTO chambers VALUES (1,'Hall of Mirrors',1);\nINSERT INTO chambers VALUES (2,'Serpent Hall',2);\nINSERT INTO chambers VALUES (3,'Sand Vault',2);\nINSERT INTO chambers VALUES (4,'Star Room',3);\nINSERT INTO chambers VALUES (5,'Abyss',4);\nINSERT INTO treasures VALUES (1,'Golden Crown','gold',900,1);\nINSERT INTO treasures VALUES (2,'Ruby Eye','jewel',1200,2);\nINSERT INTO treasures VALUES (3,'Scroll of Winds','scroll',NULL,4);\nINSERT INTO treasures VALUES (4,'Silver Lamp','lamp',400,1);\nINSERT INTO treasures VALUES (5,'Emerald Serpent','jewel',1500,2);\nINSERT INTO treasures VALUES (6,'Sun Coin','gold',150,3);\nINSERT INTO treasures VALUES (7,'Moon Pearl','jewel',800,4);\nINSERT INTO treasures VALUES (8,'Scroll of Fire','scroll',300,3);\nINSERT INTO treasures VALUES (9,'Copper Lamp','lamp',90,3);\nINSERT INTO treasures VALUES (10,'Sultan''s Chain','gold',600,2);\nINSERT INTO treasures VALUES (11,'Star Map','scroll',NULL,4);\nINSERT INTO treasures VALUES (12,'Sapphire Ring','jewel',700,1);\nINSERT INTO treasures VALUES (13,'Black Lamp','lamp',NULL,5);\nINSERT INTO treasures VALUES (14,'Golden Scarab','gold',450,1);\nINSERT INTO curses VALUES (1,2,'Blindness',7);\nINSERT INTO curses VALUES (2,5,'Venom',9);\nINSERT INTO curses VALUES (3,5,'Stone',6);\nINSERT INTO curses VALUES (4,1,'Greed',4);\nINSERT INTO curses VALUES (5,3,'Storm',8);\nINSERT INTO curses VALUES (6,13,'Shadow',10);\nINSERT INTO curses VALUES (7,7,'Sleep',3);\nINSERT INTO curses VALUES (8,2,'Fire',5);\nINSERT INTO curses VALUES (9,10,'Chains',6);\nINSERT INTO curses VALUES (10,13,'Silence',7);\nINSERT INTO curses VALUES (11,5,'Fear',5);", "tables": ["chambers", "treasures", "curses"], "sections": [{"id": "null", "title": "Missing values: NULL", "intro": "<p><code>NULL<\/code> means <b>no value<\/b>. It equals nothing, so <code>= NULL<\/code> is never true, and gives no error either. The right way: <code>IS NULL<\/code>, <code>IS NOT NULL<\/code>.<\/p>", "questions": [{"id": "q1", "say": "Some of my treasures no one has ever dared to value. Show them to me.", "q": "Which treasures have an unknown value? (the treasure's name)", "expect": "SELECT name FROM treasures WHERE value IS NULL;", "hint": "<code>WHERE value IS NULL<\/code>", "why": "There are three: Scroll of Winds, Star Map, Black Lamp."}]}, {"id": "like", "title": "Patterns: LIKE", "intro": "<p><code>LIKE<\/code> compares with a pattern: <code>%<\/code> is any number of characters (even none), <code>_<\/code> exactly one. <code>'%word%'<\/code> = it's in there anywhere. Text goes in <b>single<\/b> quotes.<\/p>", "questions": [{"id": "q2", "say": "I live in a lamp myself. Find all my lamps!", "q": "Which treasures have \"Lamp\" <b>anywhere<\/b> in their name? (the treasure's name)", "expect": "SELECT name FROM treasures WHERE name LIKE '%Lamp%';", "traps": [["LIKE\\s*'Lamp%'", "That only finds names that <b>start<\/b> with \"Lamp\". Put a <code>%<\/code> at the front too."], ["=\\s*'%", "<code>=<\/code> doesn't know <code>%<\/code>: it searches literally. A pattern needs <code>LIKE<\/code>."]], "hint": "<code>WHERE name LIKE '%Lamp%'<\/code>", "why": "Silver Lamp, Copper Lamp, Black Lamp."}]}, {"id": "sort", "title": "Sorting and LIMIT", "intro": "<p><code>ORDER BY<\/code> on its own is <b>ascending<\/b> (<code>ASC<\/code>): small to large. Largest first: <code>DESC<\/code>. <code>LIMIT n<\/code> keeps only the first n rows. In ascending order <code>NULL<\/code> comes first.<\/p>", "questions": [{"id": "q3", "say": "My three most precious treasures. I'll show you only three, mortal.", "q": "Which are the 3 most valuable treasures, the most valuable first? (name and value)", "expect": "SELECT name, value FROM treasures ORDER BY value DESC LIMIT 3;", "ordered": true, "hint": "<code>ORDER BY value DESC LIMIT 3<\/code>", "why": "Emerald Serpent 1500, Ruby Eye 1200, Golden Crown 900."}, {"id": "q4", "say": "Now the cheapest. Beware, my vault plays tricks…", "q": "Which is the cheapest treasure whose value is <b>known<\/b>? (its name and value, a single row)", "expect": "SELECT name, value FROM treasures WHERE value IS NOT NULL ORDER BY value LIMIT 1;", "hint": "In ascending order <code>NULL<\/code> comes first, so filter it out first: <code>WHERE value IS NOT NULL ORDER BY value LIMIT 1<\/code>.", "why": "The Copper Lamp, worth 90 gold."}, {"id": "q5", "say": "I want my curses by strength. Start with the most terrible!", "q": "List every curse by power, the strongest first. (the curse's name and power)", "expect": "SELECT name, power FROM curses ORDER BY power DESC;", "ordered": true, "hint": "<code>ORDER BY power DESC<\/code>", "why": "Shadow (10) comes first, Sleep (3) last."}]}, {"id": "wh", "title": "WHERE or HAVING?", "intro": "<p><code>WHERE<\/code> filters single <b>rows<\/b>, before grouping. <code>HAVING<\/code> filters the finished <b>groups<\/b>, so only there can you use <code>COUNT<\/code>, <code>SUM<\/code>, <code>AVG<\/code>. Order: <b>WHERE → GROUP BY → HAVING<\/b>.<\/p>", "questions": [{"id": "q6", "say": "Which kinds have I hoarded most? Only those with more than three!", "q": "How many treasures are there of each kind? Only the kinds with <b>more than three<\/b>. (the kind and the count)", "expect": "SELECT kind, COUNT(*) FROM treasures GROUP BY kind HAVING COUNT(*) > 3;", "traps": [[">=\\s*3", "<code>&gt;= 3<\/code> lets 3 through. More than three: <code>&gt; 3<\/code>."]], "hint": "<code>GROUP BY kind HAVING COUNT(*) &gt; 3<\/code>", "why": "Gold and jewel are left, with 4 each."}, {"id": "q7", "say": "Now count only my valuable treasures. Anything under 500 gold is rubbish.", "q": "How many treasures of each kind are worth <b>more than 500 gold<\/b>? (the kind and the count)", "expect": "SELECT kind, COUNT(*) FROM treasures WHERE value > 500 GROUP BY kind;", "traps": [["HAVING\\s+(\\w+\\.)?value", "The value belongs to one treasure, not to the group. A condition about one row goes in <code>WHERE<\/code>, before <code>GROUP BY<\/code>."], ["HAVING\\s+COUNT", "The riddle doesn't filter the size of the groups, but single treasures: <code>WHERE … &gt; 500<\/code>."]], "hint": "<code>WHERE value &gt; 500 GROUP BY kind<\/code>", "why": "Gold 2, jewel 4. All scrolls and lamps are cheaper (or have no known value), so they don't even appear."}]}, {"id": "link", "title": "The column that links the tables", "intro": "<p><code>curses.treasure_id<\/code> points to <code>treasures.id<\/code>, and <code>treasures.chamber_id<\/code> points to <code>chambers.id<\/code>. With two tables in <code>FROM<\/code> you need the matching rule: <b>referring column = the other table's id<\/b>. Without it every row pairs with every row. <code>id = id<\/code> gives wrong pairs.<\/p>", "questions": [{"id": "q8", "say": "Which curse sits on which treasure? Link them, if you can!", "q": "Every curse with the name of the treasure it sits on. (the curse's name and the treasure's name)", "expect": "SELECT curses.name, treasures.name FROM curses, treasures WHERE curses.treasure_id = treasures.id;", "hint": "<code>FROM curses, treasures WHERE curses.treasure_id = treasures.id<\/code>", "why": "11 curses, 11 rows: every curse belongs to exactly one treasure."}, {"id": "q9", "say": "I keep my dearest treasures in the Serpent Hall. Not its number, use its name!", "q": "Which treasures are in the <b>Serpent Hall<\/b>? Use the chamber's <b>name<\/b>, not its number. (the treasure's name)", "expect": "SELECT treasures.name FROM treasures, chambers WHERE treasures.chamber_id = chambers.id AND chambers.name = 'Serpent Hall';", "hint": "<code>WHERE treasures.chamber_id = chambers.id AND chambers.name = 'Serpent Hall'<\/co /* ---------- SQL ---------- */
function freshDb(){ const db = new SQL.Database(); db.run(CFG.seed); return db; }
function runQuery(q){
  const db = freshDb();
  try { const r = db.exec(q); return { res: r.length ? r[r.length - 1] : { columns: [], values: [] } }; }
  catch(e){ return { err: e.message }; }
  finally { db.close(); }
}
function tableHtml(r){
  if (!r.columns.length) return `<p class="note">${U.noRows}</p>`;
  const head = r.columns.map(c => `<th>${esc(c)}</th>`).join("");
  const body = r.values.map(row => "<tr>" + row.map(v => v === null ? `<td class="null">NULL</td>` : `<td class="${typeof v === "number" ? "n" : ""}">${esc(v)}</td>`).join("") + "</tr>").join("");
  return `<div class="tbl"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
const normV = v => v === null ? "∅" : typeof v === "number" ? String(Math.round(v * 1000) / 1000) : String(v).trim().toLowerCase();
/* the expected columns must be found among the student's columns (as multisets, extra columns allowed): returns the mapping or null */
function matchCols(got, exp){
  if (!got || got.values.length !== exp.values.length) return null;
  const col = (r, i) => r.values.map(row => normV(row[i])).sort().join("\u0001");
  const have = got.columns.map((_, i) => col(got, i)), used = new Set(), map = [];
  for (let i = 0; i < exp.columns.length; i++){
    const want = col(exp, i), j = have.findIndex((h, k) => !used.has(k) && h === want);
    if (j < 0) return null; used.add(j); map.push(j);
  }
  return map;
}
/* ordered tasks: the sorted column (the expected 2nd column) must come in the same sequence; ties may be in any order */
function sameOrder(got, exp, map, k){ return got.values.map(r => normV(r[map[k]])).join("\u0001") === exp.values.map(r => normV(r[k])).join("\u0001"); }

/* ---------- tasks ---------- */
const QS = [];
CFG.sections.forEach(sec => sec.questions.forEach(q => { q.sec = sec; QS.push(q); }));
const N = QS.length;
const EXP = {};
const D = q => S.done[q.id] || (S.done[q.id] = { tries: 0 });
const isDone = q => { const d = S.done[q.id]; return !!(d && (d.ok || d.rev)); };
const doneCount = () => QS.filter(isDone).length;
function status(q){ const d = S.done[q.id]; return !d || !(d.ok || d.rev) ? "skip" : d.rev ? "rev" : d.tries === 1 ? "first" : "later"; }
function exp(q){ return EXP[q.id] || (EXP[q.id] = runQuery(q.expect).res); }
function judge(q, sql){
  const r = runQuery(sql);
  if (r.err) return { ok: false, err: r.err };
  const e = exp(q), map = matchCols(r.res, e);
  if (!map) return { ok: false, res: r.res };
  if (q.ordered && !sameOrder(r.res, e, map, 1)) return { ok: false, res: r.res, order: true };
  return { ok: true, res: r.res };
}
/* a targeted tip for a wrong query: the task's own traps first, then the typical mistakes from the test */
function diagnose(q, sql, j){
  const s = sql.replace(/\s+/g, " ");
  for (const [re, tip] of (q.traps || [])) if (new RegExp(re, "i").test(s)) return tip;
  const e = exp(q), err = (j.err || "").toLowerCase();
  if (/=\s*null\b/i.test(s)) return U.mNull;
  if (err.includes("misuse of aggregate")) return U.mAgg;
  if (err.includes("ambiguous column")) return U.mAmb;
  if (/"[^"]*"/.test(s) && err.includes("no such column")) return U.mDquote;
  if (err.includes("no such column")) return U.mCol((j.err.match(/no such column: (\S+)/i) || [])[1] || "");
  if (err.includes("no such table")) return U.mTable;
  if (err) return U.mSyntax;
  const from = (s.match(/\bFROM\s+(.+?)(?=\s+(WHERE|GROUP|ORDER|HAVING|LIMIT)\b|;|$)/i) || [])[1] || "";
  const nTables = from.split(",").filter(x => x.trim()).length;
  if (/\b\w+\.id\s*=\s*\w+\.id\b/i.test(s)) return U.mIdId;
  if (nTables >= 2 && (s.match(/\w+\.\w+\s*=\s*\w+\.\w+/g) || []).length < nTables - 1) return U.mCart(nTables);
  if (/\bLIKE\s*'[^'%_]*'/i.test(s)) return U.mLikeNoPct;
  if (/=\s*'[^']*%[^']*'/.test(s)) return U.mEqPct;
  if (j.order) return U.mOrder;
  if (/\bDESC\b/i.test(q.expect) && !/\bDESC\b/i.test(s) && /\bORDER\s+BY\b/i.test(s)) return U.mDesc;
  if (j.res){
    if (/\bLIMIT\b/i.test(q.expect) && !/\bLIMIT\b/i.test(s)) return U.mLimit;
    if (j.res.values.some(r => r.some(v => v === null)) && !e.values.some(r => r.some(v => v === null))) return U.mNullRows;
    if (/\bHAVING\b/i.test(q.expect) && !/\bHAVING\b/i.test(s) && /\bGROUP\s+BY\b/i.test(s)) return U.mHaving;
    if (/\bGROUP\s+BY\b/i.test(q.expect) && !/\bGROUP\s+BY\b/i.test(s) && /\b(COUNT|SUM|AVG)\s*\(/i.test(s)) return U.mGroup;
    if (j.res.values.length !== e.values.length) return U.mRows(j.res.values.length, e.values.length);
    return U.mCols;
  }
  return null;
}

function confetti(n){
  const cols = ["#ffe39a", "#e9b949", "#ffffff", "#c9b6ff", "#ff9bd2", "#7fe3ff"];
  for (let i = 0; i < n; i++) spark(Math.random() * W, -20 - Math.random() * H * .5, { kind: "conf", vx: (Math.random() - .5) * 2, vy: 1 + Math.random() * 2.5, g: .04, max: 300, s: 6 + Math.random() * 6, c: pick(cols), rot: Math.random() * 6, vr: (Math.random() - .5) * .3, drag: .995 });
}
function tick(){
  G.clearRect(0, 0, W, H);
  if (!reduced && Math.random() < .55)
    spark(Math.random() * W, H + 10, { vx: (Math.random() - .5) * .5, vy: -.6 - Math.random() * 1.4, max: 160 + Math.random() * 120, s: .7 + Math.random() * 1.8, c: pick(["#ff7a2a", "#ffb04a", "#ff4a1a", "#9f7bff"]) });
  if (dissolve) for (let k = 0; k < 14; k++){ const p = svgPt(80 + Math.random() * 840, 40 + Math.random() * 820);
    spark(p.x, p.y, { vx: (Math.random() - .5) * 1.5, vy: -1 - Math.random() * 3.5, max: 70 + Math.random() * 60, s: 1.2 + Math.random() * 3, c: pick(["#ffe39a", "#ff9a3a", "#6fe3ff", "#c9b6ff", "#ffffff"]) }); }
  G.globalCompositeOperation = "lighter";
  P = P.filter(p => {
    p.life++; const t = p.life / p.max; if (t >= 1) return false;
    p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    G.globalAlpha = Math.max(0, p.kind === "conf" ? Math.min(1, (1 - t) * 3) : 1 - t);
    if (p.kind === "ring"){ G.strokeStyle = p.c; G.lineWidth = 4 * (1 - t); G.beginPath(); G.arc(p.x, p.y, p.s + t * p.big, 0, 7); G.stroke(); }
    else if (p.kind === "conf"){ G.globalCompositeOperation = "source-over"; G.save(); G.translate(p.x, p.y); G.rotate(p.rot); G.fillStyle = p.c; G.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); G.restore(); G.globalCompositeOperation = "lighter"; }
    else { G.fillStyle = p.c; G.beginPath(); G.arc(p.x, p.y, p.s * (1 - t * .5), 0, 7); G.fill(); }
    return true;
  });
  G.globalAlpha = 1; G.globalCompositeOperation = "source-over";
  requestAnimationFrame(tick);
}

function topView(){ const p = $("panel"); if (getComputedStyle(p).position === "fixed") p.scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" }); else scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" }); }
function schemaHtml(){
  const sc = CFG.schema, open = S.schemaOpen !== false;
  const tbl = t => `<div class="st"><h5>${t.name}</h5>${t.cols.map(([c, d, fk]) => `<div class="${fk ? "fk" : ""}">${c === "id" ? '<span class="k">🔑</span> ' : fk ? "→ " : ""}<b>${c}</b>: ${d}${fk ? ` (<code>${fk}</code>)` : ""}</div>`).join("")}</div>`;
  return `<details class="schema" id="schema"${open ? " open" : ""}><summary>${U.schemaH}</summary><div class="sch">${sc.tables.map(tbl).join("")}</div>
    <div class="lk"><span>${U.links}:</span>${sc.links.map(([a, b]) => `<code>${a} = ${b}</code>`).join("")}<button type="button" class="allrows" id="allRows">${U.allRows}</button></div></details>`;
}
/* ---------- screens ---------- */
function sealsHtml(){
  return `<div class="seals" id="seals" role="list">${QS.map((q, i) => `<button type="button" class="seal ${status(q) === "skip" ? "" : status(q)}${i === S.cur && !S.finished ? " cur" : ""}" data-i="${i}" role="listitem" aria-label="${U.qOf(i + 1, N)}"><span>${i + 1}</span></button>`).join("")}</div>`;
}
function startScreen(){
  DJ.setAttribute("class", "dormant"); hush(); setPower();
  $("panel").innerHTML = `<div class="card"><div class="kicker">${U.kicker}</div><h1>${U.title}</h1><div class="story">${U.story}</div>
    <ul class="rules">${U.rules.map(r => `<li>${r}</li>`).join("")}</ul>
    <label class="nm" for="nm">${U.name}</label><input class="nm" id="nm" autocomplete="name" placeholder="${U.namePh}" value="${esc(S.name)}">
    <div style="margin-top:14px"><button type="button" class="btn gold big" id="wake">${U.start}</button></div><p class="note" id="startNote" style="color:var(--bad)"></p></div>`;
  $("wake").onclick = () => { const n = $("nm").value.trim(); if (!n){ $("startNote").textContent = U.nameFirst; $("nm").focus(); return; }
    S = { name: n, started: Date.now(), ans: {}, done: {}, cur: 0, finished: 0 }; save(); wake(() => go(0, U.intro)); };
  $("nm").onkeydown = e => { if (e.key === "Enter") $("wake").click(); };
}
function wake(then){
  DJ.setAttribute("class", "dormant waking"); void DJ.getBoundingClientRect();
  DJ.classList.remove("dormant"); rumble();
  const e = svgPt(500, 270); burst(e.x, e.y, 60, ["#ffb04a", "#ff6a1a", "#ffe39a"], 6); ring(e.x, e.y, "#ff8a3a", 260);
  topView();
  setTimeout(() => { DJ.classList.remove("waking"); then && then(); }, reduced ? 50 : 900);
}
function go(i, opening){
  if (S.finished) return;
  S.cur = Math.max(0, Math.min(N - 1, i)); save();
  const q = QS[S.cur];
  card(q);
  if (!isDone(q)){
    mood("ask", 1300); rumble();
    const e = svgPt(500, 270); ring(e.x, e.y, "rgba(255,140,60,.9)", 220);
    say((opening ? opening + " " : "") + q.say);
  } else say(U.already);
}
function card(q){
  const i = QS.indexOf(q), done = isDone(q), d = S.done[q.id] || { tries: 0 }, a = S.ans[q.id] || "";
  $("panel").innerHTML = `<div class="card${done ? " locked" : ""}" id="qc">
      <div class="qtop"><span class="qno">${U.qOf(i + 1, N)}</span><span class="chip">${q.sec.title}</span>
        <span class="qnav"><button type="button" id="prevQ" aria-label="${U.prev}"${i === 0 ? " disabled" : ""}>←</button><button type="button" id="nextQ" aria-label="${U.next}"${i === N - 1 ? " disabled" : ""}>→</button></span></div>
      ${sealsHtml()}
      <details class="remind"${q.sec.questions[0] === q && !done ? " open" : ""}><summary>${U.remind}</summary>${q.sec.intro}</details>
      <div class="qtext">${q.q}</div>
      ${schemaHtml()}
      <div class="sqlbox"><textarea id="sql" spellcheck="false" aria-label="${U.query}" placeholder="SELECT …"${done ? " readonly" : ""}>${esc(a)}</textarea>
        <div class="row"><button type="button" class="btn" id="run">${U.run}</button>
          <button type="button" class="btn gold" id="checkBtn"${done ? " hidden" : ""}>${U.check}</button>
          <button type="button" class="btn ghost" id="revealBtn"${done || d.tries < 2 ? " hidden" : ""}>${U.reveal}</button>
          <button type="button" class="btn gold" id="goNext"${done ? "" : " hidden"}>${doneCount() === N ? U.toEnd : U.nextRiddle}</button>
          <span class="hint">${U.runHint}</span></div>
        <div class="fb" id="fb" aria-live="polite"></div>
        <div class="out" id="out" aria-live="polite"></div></div>
    </div>
    <div class="foot"><button type="button" class="btn" id="openTables">${U.tables}</button><span class="grow"></span><span id="finNote"></span><button type="button" class="btn" id="finish">${U.finish}</button></div>`;
  const ta = $("sql");
  ta.oninput = () => { S.ans[q.id] = ta.value; save(); };
  ta.onkeydown = e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); run(); } };
  $("run").onclick = run;
  $("checkBtn").onclick = () => check(q); $("revealBtn").onclick = () => reveal(q); $("goNext").onclick = nextOpen;
  $("prevQ").onclick = () => go(i - 1); $("nextQ").onclick = () => go(i + 1);
  $("openTables").onclick = openTables; $("finish").onclick = askFinish;
  $("seals").querySelectorAll(".seal").forEach(b => b.onclick = () => go(+b.dataset.i));
  $("schema").ontoggle = () => { S.schemaOpen = $("schema").open; save(); };
  $("allRows").onclick = openTables;
  if (done) showDone(q, false); else if (a) run();
}
function run(){
  const sql = $("sql").value;
  if (!sql.trim()){ $("out").innerHTML = `<div class="err">${U.empty}</div>`; return; }
  const r = runQuery(sql);
  $("out").innerHTML = r.err ? `<div class="err">${U.sqlErr}: ${esc(r.err)}</div>` : `<div class="meta">${U.rows(r.res.values.length)}</div>${tableHtml(r.res)}`;
}
function fb(k, html){ const f = $("fb"); f.className = "fb " + k; f.innerHTML = html; }
function check(q){
  if (S.finished || isDone(q)) return;
  const sql = $("sql").value;
  if (!sql.trim()){ fb("bad", U.answerFirst); say(U.impatient, "bad"); return; }
  run();
  const d = D(q); d.tries++;
  const j = judge(q, sql);
  if (j.ok){ d.ok = true; save(); win(q); return; }
  save();
  fb("bad", `<b>${U.notYet}</b> ${diagnose(q, sql, j) || U.tryAgain}${d.tries >= 2 ? `<p>${U.hintLabel} ${q.hint}</p>` : ""}`);
  if (d.tries >= 2) $("revealBtn").hidden = false;
  mood("laugh", 1500); rage(); say(pick(U.laughs), "bad");
}
function reveal(q){
  if (S.finished || isDone(q)) return;
  D(q).rev = true; save();
  mood("laugh", 1500); say(U.gloat, "bad");
  showDone(q, true);
  if (doneCount() === N) setTimeout(finale, 1600);
}
function win(q){
  showDone(q, true);
  if (/"[^"]*"/.test(S.ans[q.id] || "")) $("fb").insertAdjacentHTML("beforeend", `<p>${U.dqNote}</p>`);   /* SQLite forgives "text", the test didn't */
  mood("hurt", 1200); rumble(); say(pick(U.hurts), "good");
  const c = svgPt(500, 560), e = svgPt(500, 270);
  burst(c.x, c.y, 90, ["#ffe39a", "#e9b949", "#ffffff", "#ffb84a"], 9); ring(c.x, c.y, "#ffe39a", 260);
  burst(e.x, e.y, 30, ["#ffffff", "#ffe39a"], 5);
  const b = $("seals").children[QS.indexOf(q)]; if (b){ b.classList.add("ignite"); const r = b.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 20, ["#ffe39a", "#ffffff"], 3); }
  setPower();
  if (doneCount() === N) setTimeout(finale, 1700);
}
function showDone(q, fresh){
  const d = S.done[q.id];
  $("qc").classList.add("locked"); $("sql").readOnly = true;
  $("checkBtn").hidden = true; $("revealBtn").hidden = true;
  const s = $("seals").children[QS.indexOf(q)]; if (s) s.className = "seal " + status(q) + (s.classList.contains("ignite") ? " ignite" : "");
  const head = d.rev ? U.solutionH : d.tries === 1 ? U.rightFirst : U.right;
  fb(d.rev ? "part" : "ok", `<b>${head}</b>${d.rev ? `<pre>${esc(q.expect)}</pre>` : ""}${q.why ? `<p>${q.why}</p>` : ""}`);
  const nx = $("goNext"); nx.hidden = doneCount() === N && fresh; nx.textContent = doneCount() === N ? U.toEnd : U.nextRiddle;
  if (fresh && doneCount() < N) setTimeout(() => nx.focus({ preventScroll: true }), 50);
}
function nextOpen(){
  if (doneCount() === N) return results();
  for (let k = 1; k <= N; k++){ const j = (S.cur + k) % N; if (!isDone(QS[j])){ go(j); topView(); return; } }
}
let finT = 0;
function askFinish(){
  const missing = N - doneCount();
  if (Date.now() - finT > 4000){ finT = Date.now(); $("finNote").textContent = U.confirm(missing); $("finish").textContent = U.finishSure; return; }
  S.finished = Date.now(); save();
  if (doneCount() === N) finale(); else { mood("laugh", 1800); rage(); say(U.leftEarly, "bad"); results(); }
}

/* ---------- the end: the seals burn him away ---------- */
function finale(){
  if (!S.finished){ S.finished = Date.now(); save(); }
  topView();
  $("panel").innerHTML = "";
  const T = reduced ? [0, 50, 100, 150] : [0, 1900, 3600, 5600];
  say(U.noo, "bad");
  DJ.classList.remove("ask", "hurt", "laugh"); DJ.classList.add("dying"); rumble();
  setTimeout(() => { dissolve = 1; hush(); DJ.classList.add("gone"); }, T[1]);
  setTimeout(() => { dissolve = 0;
    const c = svgPt(500, 330);
    burst(c.x, c.y, 220, ["#ffe39a", "#ffffff", "#e9b949", "#ffb84a", "#c9b6ff"], 13); ring(c.x, c.y, "#ffffff", 500); ring(c.x, c.y, "#ffe39a", 380);
    STAGE.classList.add("freed"); STAGE.style.setProperty("--power", 0);
    const f = document.createElement("div"); f.className = "finale"; f.id = "finaleBox";
    f.innerHTML = `<h2>${[...U.finaleTitle].map((ch, i) => `<span style="animation-delay:${(i * .05).toFixed(2)}s">${ch === " " ? "&nbsp;" : esc(ch)}</span>`).join("")}</h2><p>${U.finaleSub}</p>`;
    $("finaleBox")?.remove(); document.body.appendChild(f);
    confetti(reduced ? 0 : 180);
    const fw = setInterval(() => { if (reduced) return clearInterval(fw);
      burst(W * (.12 + Math.random() * .76), H * (.1 + Math.random() * .45), 60, pick([["#ffe39a", "#ffffff"], ["#c9b6ff", "#ffffff"], ["#ff9bd2", "#ffe39a"], ["#7fe3ff", "#ffffff"]]), 7); }, 380);
    setTimeout(() => clearInterval(fw), 5000);
  }, T[2]);
  setTimeout(results, T[3]);
}
function freedState(){ DJ.setAttribute("class", "gone"); STAGE.classList.add("freed"); STAGE.style.setProperty("--power", 0); hush(); }

/* ---------- results + export ---------- */
function results(){
  const cnt = k => QS.filter(q => status(q) === k).length;
  const rows = CFG.sections.map(sec => `<tr><td>${sec.title}</td><td class="n">${sec.questions.filter(q => status(q) === "first").length} / ${sec.questions.length}</td></tr>`).join("");
  $("panel").innerHTML = `<div class="card result"><div class="kicker">${doneCount() === N ? U.freedK : U.escapedK}</div>
    <div class="big">${cnt("first")} / ${N}</div><div class="sub">${U.pracSub(cnt("first"), cnt("later"), cnt("rev"), cnt("skip"))}</div>
    <table class="sumtbl"><thead><tr><th></th><th>${U.firstTry}</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="export"><h3>${U.handH}</h3><ol>${U.handSteps.map(s => `<li>${s}</li>`).join("")}</ol>
    <div class="row"><button type="button" class="btn gold" id="saveTxt">${U.save}</button><button type="button" class="btn" id="copyTxt">${U.copy}</button>
    ${doneCount() === N ? `<button type="button" class="btn ghost" id="replay">${U.replay}</button>` : ""}</div><p class="note" id="exNote" aria-live="polite"></p></div></div>`;
  $("saveTxt").onclick = saveTxt; $("copyTxt").onclick = copyTxt;
  if ($("replay")) $("replay").onclick = () => { STAGE.classList.remove("freed"); $("finaleBox")?.remove(); P = []; setPower();
    DJ.setAttribute("class", "dormant"); wake(() => { say(U.intro); setTimeout(finale, 1500); }); };
}
const mmss = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const plain = s => String(s).replace(/<[^>]+>/g, "").replace(/&gt;/g, ">").replace(/&lt;/g, "<").replace(/&amp;/g, "&");
function report(){
  const end = S.finished || Date.now();
  const L = [CFG.reportTitle, "", `${U.rName}: ${S.name}`, `${U.rDate}: ${new Date(end).toLocaleString(CFG.lang === "hu" ? "hu-HU" : "en-GB")}`,
    `${U.rTime}: ${mmss(end - S.started)}`, `${U.rFirst}: ${QS.filter(q => status(q) === "first").length} / ${N}`, ""];
  CFG.sections.forEach(sec => { L.push("== " + plain(sec.title));
    sec.questions.forEach(q => { const a = (S.ans[q.id] || "").trim();
      L.push(`${QS.indexOf(q) + 1}. [${U.status(status(q), (S.done[q.id] || {}).tries || 0)}]` + (a ? "\n    " + a.replace(/\n/g, "\n    ") : " " + U.none)); });
    L.push(""); });
  return L.join("\n");
}
function fileName(){ return `${CFG.filePrefix}-${S.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase() || "valasz"}.txt`; }
function saveTxt(){
  try { const b = new Blob([report()], { type: "text/plain;charset=utf-8" }), u = URL.createObjectURL(b), a = document.createElement("a");
    a.href = u; a.download = fileName(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1500);
    $("exNote").textContent = U.saved(fileName()); } catch(e){ $("exNote").textContent = U.saveBlocked; }
}
function copyTxt(){ navigator.clipboard.writeText(report()).then(() => $("exNote").textContent = U.copied, () => $("exNote").textContent = U.copyBlocked); }

/* ---------- the vault's tables ---------- */
function openTables(){
  const db = freshDb();
  $("tablesH").textContent = U.tablesH;
  $("tablesBody").innerHTML = CFG.tables.map(t => { const r = db.exec(`SELECT * FROM ${t}`)[0];
    return `<div class="dt"><h4>${t}<span>${U.rows(r.values.length)}</span></h4>${tableHtml(r)}</div>`; }).join("");
  db.close(); $("tables").showModal();
}
$("tablesClose").onclick = () => $("tables").close();
$("tables").addEventListener("click", e => { if (e.target === $("tables")) $("tables").close(); });

/* ---------- boot ---------- */
function boot(){
  fit(); requestAnimationFrame(tick);
  if (typeof initSqlJs !== "function"){ $("panel").innerHTML = `<div class="err">${U.engFail}</div>`; return; }
  initSqlJs().then(s => { SQL = s; setPower();
    if (!S.started) return startScreen();
    if (S.finished){ if (doneCount() === N) freedState(); else { DJ.setAttribute("class", ""); say(U.leftEarly, "bad"); } return results(); }
    wake(() => go(S.cur, U.welcomeBack));
  }).catch(() => { $("panel").innerHTML = `<div class="err">${U.engFail}</div>`; });
}
boot();
</script>
