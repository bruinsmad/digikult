<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>/* moving between pages: the old page drifts aside and fades, the new one glides in; the rail holds still */@view-transition{navigation:auto}.rail{view-transition-name:rail}::view-transition-group(root){animation:none}::view-transition-old(root){animation:dk-out .2s cubic-bezier(.4,0,1,1) both}::view-transition-new(root){animation:dk-in .38s cubic-bezier(.16,1,.3,1) .06s both}::view-transition-old(rail),::view-transition-new(rail){animation:none}@keyframes dk-out{to{opacity:0;transform:translateX(-18px)}}@keyframes dk-in{from{opacity:0;transform:translateX(26px)}}@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}</style>
<title>A dzsinn húsz kérdése</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* The Djinn's riddles: a practice sheet shown one riddle at a time. A big, always-moving djinn rises from his lamp
   (left, sticky on wide screens; on top on phones), the riddle card sits beside him. Right answers burn seals onto the
   lamp and hurt him, wrong ones make him laugh; twenty seals pull him back into the lamp. */
:root{
  --night:#0b0719; --night-2:#1a0f38; --violet:#6b3fd6; --violet-2:#3a1f86; --gold:#f2c14e; --gold-2:#ffe08a; --ember:#ff6a2b;
  --ink:#f4ecff; --muted:#b8a8dc; --card:#fbf6ea; --card-ink:#231742; --card-muted:#6a5c86; --line:#e3d8bf;
  --good:#1f7a4a; --good-bg:#e2f3e8; --bad:#a3243b; --bad-bg:#fbe3e6; --part:#8a5a00; --part-bg:#fdf0d2;
  --f-body:"Atkinson Hyperlegible", system-ui, sans-serif; --f-disp:"Cinzel", Georgia, serif; --f-mono:"JetBrains Mono", ui-monospace, monospace;
  --power:1;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.55 var(--f-body);
  background:radial-gradient(900px 600px at 20% 10%, #2a1660 0%, transparent 60%), radial-gradient(700px 500px at 90% 90%, #3a0f3a 0%, transparent 60%), linear-gradient(var(--night-2), var(--night));
  background-attachment:fixed}
a{color:inherit}
code,pre,textarea{font-family:var(--f-mono)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}

.topline{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-left));font-size:14px;color:var(--muted);position:relative;z-index:5}
.crumb a{text-decoration:none}.crumb a:hover{color:#fff;text-decoration:underline}
.langlink{margin-left:auto;font:700 14px var(--f-body);color:#fff;border:1.5px solid rgba(255,255,255,.4);border-radius:4px;padding:4px 10px;text-decoration:none}

.app{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:980px){
  .app{grid-template-columns:minmax(440px,1.08fr) minmax(440px,1fr);align-items:start}
  .stage{position:sticky;top:0;height:100vh}
  .topline{position:absolute;left:0;right:0;top:0}
  .panel{padding-top:64px!important}
  .sealcount{top:52px!important}
}

/* ---------- the stage ---------- */
.stage{position:relative;height:min(64vh,520px);min-height:380px;overflow:hidden;isolation:isolate}
@media (min-width:980px){.stage{height:100vh;min-height:560px}}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.aura{position:absolute;left:50%;top:44%;width:min(88%,560px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:0;
  background:radial-gradient(circle, rgba(255,90,60,calc(.30*var(--power))) 0%, rgba(140,60,230,calc(.32*var(--power))) 38%, rgba(60,20,140,0) 70%);
  animation:auraPulse 4.2s ease-in-out infinite;transition:background 1.2s}
@keyframes auraPulse{0%,100%{transform:translate(-50%,-50%) scale(.94);opacity:.85}50%{transform:translate(-50%,-50%) scale(1.06);opacity:1}}
.rays{position:absolute;left:50%;top:78%;width:180vmax;height:180vmax;transform:translate(-50%,-50%) scale(.2);z-index:1;opacity:0;pointer-events:none;border-radius:50%;
  background:repeating-conic-gradient(from 0deg, rgba(255,224,138,.55) 0deg 7deg, rgba(255,224,138,0) 7deg 18deg);
  -webkit-mask:radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 30%, transparent 62%);mask:radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 30%, transparent 62%)}
.stage.sealed .rays{opacity:1;transform:translate(-50%,-50%) scale(1);transition:opacity 1.2s, transform 1.6s cubic-bezier(.2,.8,.2,1);animation:raySpin 26s linear infinite}
@keyframes raySpin{to{rotate:360deg}}

#djinn{position:absolute;left:50%;bottom:58px;height:calc(100% - 92px);max-height:640px;aspect-ratio:400/500;transform:translateX(-50%);z-index:2;overflow:visible}
@media (max-width:979px){#djinn{bottom:64px;height:calc(100% - 84px)} .rune{width:21px;height:21px;font-size:10px} .runes{gap:3px;bottom:8px}}

/* idle life: floating, breathing, swaying arms, waving topknot, blinking, glowing eyes, glowing orb */
#whole{transform-box:view-box;transform-origin:200px 470px;transition:transform 1.6s cubic-bezier(.6,-.2,.7,1), opacity 1.4s}
#floater{animation:float 4.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
#torso{transform-box:view-box;transform-origin:200px 300px;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,1.035)}}
#armL{transform-box:view-box;transform-origin:130px 214px;animation:swayL 5.2s ease-in-out infinite;transition:transform .5s}
@keyframes swayL{0%,100%{rotate:0deg}50%{rotate:-5deg}}
#armR{transform-box:view-box;transform-origin:270px 214px;animation:swayR 6s ease-in-out infinite}
@keyframes swayR{0%,100%{rotate:0deg}50%{rotate:3deg}}
#head{transform-box:view-box;transform-origin:200px 185px;animation:headIdle 7s ease-in-out infinite}
@keyframes headIdle{0%,100%{rotate:0deg}30%{rotate:-2.5deg}70%{rotate:2deg}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.3s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
#eyeGlow{animation:glowPulse 2.2s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:1}}
#orb{transform-box:fill-box;transform-origin:center;animation:orbPulse 1.8s ease-in-out infinite}
@keyframes orbPulse{0%,100%{transform:scale(.92)}50%{transform:scale(1.08)}}
#orbSwirl{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#brows{transform-box:view-box;transform-origin:200px 115px;transition:transform .3s}
.mouth{opacity:0;transition:opacity .15s}
#mGrin{opacity:1}
#lamp{transform-box:view-box;transform-origin:210px 480px}
#lid{transform-box:view-box;transform-origin:236px 428px;transition:transform .4s}
#lampShine{animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,100%{opacity:.25}50%{opacity:.65}}

/* asking: he swells, raises the orb, his eyes flare */
#djinn.ask #whole{animation:askSwell 1.1s cubic-bezier(.3,1.6,.5,1)}
@keyframes askSwell{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
#djinn.ask #armL{animation:raise 1.1s ease-in-out}
@keyframes raise{0%,100%{rotate:0deg}40%{rotate:14deg}}
#djinn.ask #eyeGlow{animation:flare 1.1s ease-out}
@keyframes flare{0%{opacity:1}30%{opacity:1;filter:brightness(2)}100%{opacity:.6}}
/* hurt (a right answer): flash, recoil, shake, grimace */
#djinn.hurt #floater{animation:recoil .9s cubic-bezier(.3,.7,.4,1)}
@keyframes recoil{0%{transform:translate(0,0) rotate(0)}10%{transform:translate(-10px,4px) rotate(-4deg)}20%{transform:translate(9px,-2px) rotate(3deg)}30%{transform:translate(-7px,3px) rotate(-2deg)}45%{transform:translate(5px,0) rotate(1deg)}60%{transform:translate(-3px,1px)}100%{transform:translate(0,0)}}
#djinn.hurt #body{animation:flash .7s ease-out}
@keyframes flash{0%{filter:brightness(2.4) saturate(.3)}100%{filter:none}}
#djinn.hurt #mGrin,#djinn.laugh #mGrin,#djinn.sealing #mGrin{opacity:0}
#djinn.hurt #mHurt,#djinn.sealing #mHurt{opacity:1}
#djinn.hurt #brows{transform:translateY(-4px) scaleY(.85)}
#djinn.hurt .eye{animation:squint .9s ease-out}
@keyframes squint{0%,100%{transform:scaleY(1)}20%,70%{transform:scaleY(.35)}}
/* laughing (a wrong answer): head back, mouth open, shoulders shaking */
#djinn.laugh #mLaugh{opacity:1}
#djinn.laugh #head{animation:laughHead .32s ease-in-out 4}
@keyframes laughHead{0%,100%{rotate:-4deg;translate:0 0}50%{rotate:-7deg;translate:0 -4px}}
#djinn.laugh #torso{animation:laughBody .32s ease-in-out 4}
@keyframes laughBody{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px) scale(1.02)}}
#djinn.laugh #armR{animation:laughArm .32s ease-in-out 4}
@keyframes laughArm{0%,100%{rotate:0deg}50%{rotate:-8deg}}
#djinn.laugh #eyeGlow{opacity:1}
/* sealing: he struggles, then spirals down into the spout */
#djinn.sealing #floater{animation:struggle .12s linear infinite}
@keyframes struggle{0%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}100%{transform:translate(-3px,1px)}}
#djinn.gone #whole{transform:translate(-92px,-10px) scale(.02) rotate(-720deg);opacity:0}
#djinn.gone #lid{transform:translateY(-14px) rotate(-18deg)}
#djinn.shut #lid{transform:none;transition:transform .25s cubic-bezier(.5,2,.5,1)}
#djinn.shut #lamp{animation:lampJolt .6s ease-out}
@keyframes lampJolt{0%{transform:translateY(0)}20%{transform:translateY(6px) scale(1.04,.95)}45%{transform:translateY(-10px) rotate(-3deg)}70%{transform:translateY(2px) rotate(2deg)}100%{transform:none}}
#djinn.asleep #whole{transform:translate(-92px,-10px) scale(.02);opacity:0;transition:none}
#djinn.emerge #whole{transition:transform 1.5s cubic-bezier(.2,1.3,.4,1), opacity .5s}
#djinn.sealed-glow #lamp{filter:drop-shadow(0 0 16px rgba(255,224,138,.9)) drop-shadow(0 0 40px rgba(255,190,80,.6))}

/* speech bubble */
.bubble{position:absolute;z-index:4;left:50%;top:14px;transform:translateX(-50%);width:min(92%,460px);background:rgba(20,10,46,.86);border:1.5px solid rgba(242,193,78,.55);
  border-radius:16px;padding:12px 16px 12px;box-shadow:0 10px 40px rgba(0,0,0,.5), inset 0 0 30px rgba(107,63,214,.25);backdrop-filter:blur(4px);
  font:700 clamp(16px,1.9vw,19px)/1.4 var(--f-disp);color:var(--gold-2);letter-spacing:.01em;text-align:center;min-height:52px;
  transition:opacity .3s, transform .35s cubic-bezier(.3,1.6,.5,1)}
.bubble.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:translateX(-50%) scale(.7);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
.bubble.hide{opacity:0;transform:translateX(-50%) scale(.9)}
.bubble i{font-style:normal;color:#fff}
.bubble.bad{border-color:rgba(255,106,43,.8);color:#ffc2a6}
.bubble.good{border-color:rgba(120,230,170,.8);color:#c9f5dc}
.bubble.muffled{font:italic 400 15px/1.4 var(--f-body);color:var(--muted);border-style:dashed;top:34%;bottom:auto;width:min(80%,340px)}
@media (min-width:980px){.bubble.muffled{top:auto;bottom:170px;right:5%} .bubble.muffled::after{display:none}
  .bubble{top:max(54px,7%);left:auto;right:3%;transform:none;width:min(44%,330px);text-align:left}
  .bubble.pop{animation:popR .45s cubic-bezier(.3,1.6,.5,1)} @keyframes popR{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
  .bubble.hide{transform:scale(.9)}
  .bubble::after{content:"";position:absolute;left:34px;bottom:-13px;border:13px solid transparent;border-top-color:rgba(242,193,78,.55);border-bottom:0}}
.taunt{position:absolute;z-index:4;font:900 34px var(--f-disp);color:#ff8a4a;text-shadow:0 0 16px rgba(255,90,40,.8);pointer-events:none;animation:taunt 1.5s ease-out forwards}
@keyframes taunt{0%{opacity:0;transform:translateY(10px) scale(.6) rotate(var(--r))}20%{opacity:1;transform:translateY(0) scale(1.15) rotate(var(--r))}100%{opacity:0;transform:translateY(-70px) scale(1) rotate(var(--r))}}

/* the seals: one per riddle */
.runes{position:absolute;z-index:4;left:0;right:0;bottom:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:0 14px 0 64px}
.rune{width:24px;height:24px;border:0;background:none;padding:0;position:relative;color:#8f7fb8;font:700 11px var(--f-mono)}
.rune::before{content:"";position:absolute;inset:3px;transform:rotate(45deg);border:1.5px solid #5a4a8c;background:#160c30;border-radius:3px;transition:all .4s}
.rune span{position:relative}
.rune.first::before{background:radial-gradient(#fff3b8,#f2c14e 60%,#b07a10);border-color:#ffe9a0;box-shadow:0 0 12px rgba(255,210,100,.85)}
.rune.first{color:#3a2400}
.rune.later::before{background:radial-gradient(#ffffff,#c9d3e6 60%,#7d8aa6);border-color:#eef3ff;box-shadow:0 0 9px rgba(200,215,255,.6)}
.rune.later{color:#1d2540}
.rune.rev::before{background:#5a3b1e;border-color:#9a6a32}
.rune.rev{color:#f3d7a8}
.rune.cur::before{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,193,78,.35);animation:runeCur 1.4s ease-in-out infinite}
@keyframes runeCur{50%{box-shadow:0 0 0 5px rgba(242,193,78,.12)}}
.rune.ignite::before{animation:ignite .9s ease-out}
@keyframes ignite{0%{transform:rotate(45deg) scale(1)}35%{transform:rotate(225deg) scale(1.9);filter:brightness(2.2)}100%{transform:rotate(405deg) scale(1)}}
.runes[aria-disabled="true"] .rune{cursor:default}
.sealcount{position:absolute;z-index:4;left:14px;top:12px;font:700 13px var(--f-disp);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sealcount b{color:var(--gold-2);font-size:17px}
@media (max-width:979px){.sealcount{display:none}}
.finale{position:absolute;z-index:5;left:50%;top:22%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:92%}
.finale h2{margin:0;font:900 clamp(30px,5vw,58px)/1.05 var(--f-disp);color:#fff4c8;letter-spacing:.04em;text-shadow:0 0 18px rgba(255,200,90,.9), 0 0 50px rgba(255,140,40,.6)}
.finale h2 span{display:inline-block;opacity:0;transform:translateY(30px) scale(.4);animation:letter .7s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes letter{to{opacity:1;transform:none}}
.finale p{margin:10px 0 0;font:700 clamp(15px,2vw,19px) var(--f-body);color:#ffe7b0;opacity:0;animation:fadeUp .8s 1.2s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- the panel ---------- */
.panel{padding:18px max(16px,env(safe-area-inset-left)) 90px;position:relative;z-index:2}
@media (min-width:980px){.panel{padding:22px 34px 90px 10px}}
.card{background:var(--card);color:var(--card-ink);border-radius:14px;padding:20px 22px 22px;box-shadow:0 18px 50px rgba(0,0,0,.45), 0 0 0 1px rgba(242,193,78,.35);max-width:720px;margin:0 auto}
.card h1{font:900 clamp(26px,3.6vw,38px)/1.1 var(--f-disp);margin:0 0 8px;color:#3a1170}
.kicker{font:700 13px var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:#8a5a00}
.story{font-size:17.5px}
.story p{margin:.5em 0}
.rules{padding-left:20px;margin:10px 0 16px;color:#3b2f58}
.rules li{margin:4px 0}
label.nm{display:block;font-weight:700;margin:10px 0 6px}
input.nm{width:100%;max-width:380px;font:inherit;padding:10px 12px;border:2px solid #cdbf9e;border-radius:8px;background:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:10px 18px;font:700 16px var(--f-body);background:#3a1170;color:#fff;box-shadow:0 3px 0 #1d0840}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1d0840}
.btn.gold{background:linear-gradient(#ffd877,#e0a92c);color:#2a1800;box-shadow:0 3px 0 #8a5a0c}
.btn.big{font-size:18px;padding:13px 24px}
.btn.ghost{background:transparent;color:#3a1170;box-shadow:inset 0 0 0 2px #b9a7da}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.note{font-size:14px;color:var(--card-muted);margin:8px 0 0}
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.qno{font:900 15px var(--f-disp);color:#8a5a00;letter-spacing:.06em}
.chip{font:700 12.5px var(--f-body);background:#efe4ff;color:#3a1170;border-radius:999px;padding:3px 10px}
.qnav{margin-left:auto;display:flex;gap:6px}
.qnav button{width:34px;height:34px;border-radius:8px;border:1.5px solid #cdbf9e;background:#fff;color:#3a1170;font-weight:700}
.qnav button[disabled]{opacity:.35}
.qtext{font:700 19px/1.4 var(--f-body);margin:6px 0 12px}
details.remind{background:#f3ecff;border-left:4px solid #6b3fd6;border-radius:8px;padding:8px 12px;margin:0 0 14px;color:#2d1d55}
details.remind summary{cursor:pointer;font-weight:700;color:#4a23a0}
details.remind .t{display:none}
details.remind p{margin:.4em 0}
details.remind pre{background:#e8ddff;padding:8px 10px;border-radius:6px;font-size:14px;overflow:auto}
details.remind code{background:#e8ddff;padding:0 4px;border-radius:4px;font-size:.92em}
pre.code{background:#1b1233;color:#efe8ff;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5;overflow:auto;margin:0 0 12px}
.code .k{color:#ffcf6a;font-weight:700}.code .f{color:#ff9bd2}.code .s{color:#9fe6b5}.code .nm{color:#9fd0ff}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer;transition:border-color .15s, background .15s}
.opt:hover{border-color:#b9a7da}
.opt input{width:18px;height:18px;accent-color:#6b3fd6;flex:none}
.opt:has(input:checked){border-color:#6b3fd6;background:#f3ecff}
.opt code,.qtext code,.fb code,.tf code{background:#efe6d2;padding:0 4px;border-radius:4px;font-size:.92em}
.tf{display:flex;align-items:center;gap:12px;justify-content:space-between;border-bottom:1px dashed var(--line);padding:8px 0}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.seg label{padding:5px 12px;cursor:pointer;font-weight:700;font-size:15px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:#6b3fd6;color:#fff}
ol.order{list-style:none;padding:0;margin:0;display:grid;gap:6px}
ol.order li{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:7px 10px;font:700 15px var(--f-mono)}
ol.order .ix{color:var(--card-muted);width:22px}
ol.order .mv{margin-left:auto;display:flex;gap:4px}
.mvb{width:32px;height:30px;border-radius:7px;border:1.5px solid #cdbf9e;background:#faf6ec;font-weight:700}
.mvb[disabled]{opacity:.3}
.num input{font:700 20px var(--f-mono);width:140px;padding:8px 12px;border:2px solid #cdbf9e;border-radius:8px}
pre.code input{font:700 15px var(--f-mono);width:9.5ch;padding:1px 6px;border:0;border-bottom:2px dashed var(--gold);background:#2c1f50;color:#fff3c4;border-radius:4px}
.lines{background:#1b1233;border-radius:10px;padding:8px 6px;margin-bottom:6px;overflow:auto}
.lines label{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:7px;cursor:pointer;color:#efe8ff;font:15px/1.5 var(--f-mono);white-space:pre}
.lines label:hover{background:rgba(255,255,255,.06)}
.lines input{accent-color:var(--gold)}
.lines .ln{color:#8f7fb8;width:18px;text-align:right}
.lines label:has(input:checked){background:rgba(242,193,78,.18);outline:1.5px solid rgba(242,193,78,.6)}
.lines .k{color:#ffcf6a;font-weight:700}.lines .f{color:#ff9bd2}.lines .s{color:#9fe6b5}.lines .nm{color:#9fd0ff}
.sqlbox textarea{width:100%;min-height:150px;font-size:15px;line-height:1.5;padding:10px 12px;border-radius:10px;border:2px solid #3a2a66;background:#1b1233;color:#f4ecff;resize:vertical}
.sqlbox .row{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.hint{font-size:13px;color:var(--card-muted)}
.out .meta{font:700 13px var(--f-mono);color:var(--card-muted);margin:6px 0}
.out .err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:8px 10px;font:14px var(--f-mono)}
.tbl{overflow:auto;max-height:300px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.tbl table{border-collapse:collapse;width:100%;font:14px var(--f-mono)}
.tbl th{position:sticky;top:0;background:#efe4ff;text-align:left;padding:5px 8px;color:#3a1170}
.tbl td{padding:4px 8px;border-top:1px solid #f0eadb;white-space:nowrap}
.tbl td.n{text-align:right}
.tbl td.null{color:#a08cc8;font-style:italic}
.chk{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.fb{margin-top:12px;border-radius:10px;padding:0;font-size:16px}
.fb:empty{display:none}
.fb.ok{background:var(--good-bg);color:#0f4a2b;padding:10px 14px;border-left:4px solid var(--good)}
.fb.bad{background:var(--bad-bg);color:#5c0f1e;padding:10px 14px;border-left:4px solid var(--bad);animation:nudge .4s}
.fb.part{background:var(--part-bg);color:#5a3900;padding:10px 14px;border-left:4px solid var(--part)}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb p{margin:.4em 0 0}
.fb .sol{margin-top:6px}
.fb .sol pre{background:#fff7e2;padding:8px 10px;border-radius:6px;font-size:14px;overflow:auto;margin:0}
.done-lock input,.done-lock select,.done-lock textarea,.done-lock .mvb{pointer-events:none}
.tablesBtn{margin-top:18px;text-align:center}
.foot{max-width:720px;margin:16px auto 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.foot .btn.ghost{color:#e8dcff;box-shadow:inset 0 0 0 2px rgba(232,220,255,.4)}
.foot .grow{flex:1}

/* tables drawer */
dialog#tables{border:0;border-radius:14px;padding:0;max-width:min(980px,96vw);width:96vw;max-height:88vh;background:var(--card);color:var(--card-ink);box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog#tables::backdrop{background:rgba(8,4,20,.7);backdrop-filter:blur(3px)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.dlg-head h2{margin:0;font:900 20px var(--f-disp);color:#3a1170}
.dlg-head .btn{margin-left:auto}
.dlg-body{padding:14px 18px 20px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.dt h4{margin:0 0 6px;font:700 15px var(--f-mono);color:#3a1170;display:flex;justify-content:space-between}
.dt h4 span{font:400 13px var(--f-body);color:var(--card-muted)}

/* results */
.result .big{font:900 clamp(46px,8vw,72px)/1 var(--f-disp);color:#3a1170;text-align:center}
.result .sub{text-align:center;color:var(--card-muted);margin:6px 0 14px}
.sumtbl{width:100%;border-collapse:collapse;margin:8px 0 16px}
.sumtbl td,.sumtbl th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.sumtbl td.n{text-align:right;font-family:var(--f-mono)}
.export h3{font:900 18px var(--f-disp);color:#3a1170;margin:14px 0 6px}
.export ol{padding-left:20px;margin:6px 0 12px}
.export .row{display:flex;gap:10px;flex-wrap:wrap}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:14px}

@media (prefers-reduced-motion:reduce){
  #floater,#torso,#armL,#armR,#head,.aura,#orb,#orbSwirl,#lampShine{animation:none!important}
  #djinn.hurt #floater,#djinn.laugh #head,#djinn.laugh #torso,#djinn.sealing #floater{animation:none!important}
  .stage.sealed .rays{animation:none}
}
</style>

ERE vagy HAVING?", "intro": "<b class=\"t\">A lámpa súgja<\/b><p>A <code>WHERE<\/code> az egyes <b>sorokat<\/b> szűri, a csoportosítás előtt. A <code>GROUP BY<\/code> csak csoportosít. A <code>HAVING<\/code> a kész <b>csoportokat<\/b> szűri, ezért csak ott állhat <code>COUNT<\/code>, <code>SUM<\/code>, <code>AVG<\/code>.<\/p>", "questions": [{"id": "r1", "type": "mc", "pts": 1, "say": "Az első kérdésem gyerekjáték. Vagy mégsem?", "q": "Csak azokat a fajtákat akarom látni, amelyekből <b>háromnál több<\/b> kincsem van. Melyik záradékba kerül ez a feltétel?", "opts": ["<code>WHERE<\/code>", "<code>GROUP BY<\/code>", "<code>HAVING<\/code>", "<code>ORDER BY<\/code>"], "ok": 2, "fbs": {"0": "A <code>WHERE<\/code> egyenként nézi a sorokat. Egy kincs nem tudja, hány társa van.", "1": "A <code>GROUP BY<\/code> csak csoportokat képez, nem dob ki semmit.", "3": "Az <code>ORDER BY<\/code> csak sorba rendez."}, "why": "A „háromnál több” az egész csoportról szól: <code>HAVING COUNT(*) &gt; 3<\/code>."}, {"id": "r2", "type": "mc", "pts": 1, "say": "Hmm. Lássuk, tudod-e, mikor <i>nem<\/i> kell a HAVING.", "q": "Fajtánként akarom megszámolni a kincseimet, de csak az 500 aranynál értékesebbeket. Hová kerül a <code>ertek &gt; 500<\/code>?", "opts": ["<code>WHERE<\/code>", "<code>GROUP BY<\/code>", "<code>HAVING<\/code>", "<code>ORDER BY<\/code>"], "ok": 0, "fbs": {"2": "Az érték egy-egy kincs adata, nem a csoporté. Az egyes sorokat a <code>WHERE<\/code> szűri, még a csoportosítás előtt.", "1": "A <code>GROUP BY<\/code> után oszlopnév jön, nem feltétel.", "3": "Az <code>ORDER BY<\/code> nem szűr."}, "why": "Egy sorra vonatkozó feltétel a <code>WHERE<\/code>-be kerül."}, {"id": "r3", "type": "sql", "pts": 2, "say": "Most írd meg magad, halandó!", "q": "Fajtánként hány kincsem van? Csak azok a fajták kellenek, amelyekből legalább 4 van. (a fajta és a darabszám)", "expect": "SELECT fajta, COUNT(*) FROM kincsek GROUP BY fajta HAVING COUNT(*) >= 4;", "hint": "<code>GROUP BY fajta<\/code>, aztán <code>HAVING COUNT(*) &gt;= 4<\/code>.", "why": "Az arany és az ékszer marad, mindkettőből 4 van."}]}, {"id": "read", "title": "Mit ad a HAVING?", "intro": "<b class=\"t\">A lámpa súgja<\/b><p>Csoportosíts fejben: melyik érték hányszor szerepel? Írd a csoportok mellé a számot, és húzd ki, amelyikre a feltétel nem igaz. A <code>&gt; 1<\/code> az 1-et már nem engedi át. A <code>SUM<\/code> kihagyja a <code>NULL<\/code> értékeket.<\/p>", "questions": [{"id": "r4", "type": "multi", "pts": 1, "say": "Az átkaim! Melyik kincsemen ül több is?", "q": "Mely kincsek jelennek meg az eredményben? Jelöld be mindet!", "code": "SELECT kincsek.nev, COUNT(*)\nFROM atkok, kincsek\nWHERE atkok.kincs_id = kincsek.id\nGROUP BY kincsek.nev\nHAVING COUNT(*) > 1;", "opts": ["Aranykorona", "Rubinszem", "Smaragdkígyó", "Holdgyöngy", "Fekete lámpa"], "ok": [1, 2, 4], "traps": {"2": "A Smaragdkígyón 3 átok ül, de a Rubinszemen és a Fekete lámpán is kettő-kettő. A 2 is nagyobb 1-nél.", "0,1,2,3,4": "Az Aranykoronán és a Holdgyöngyön csak egy-egy átok van, és az 1 nem nagyobb 1-nél."}, "hint": "Számold meg az <code>atkok<\/code> táblában, melyik <code>kincs_id<\/code> hányszor szerepel.", "why": "Rubinszem 2, Smaragdkígyó 3, Fekete lámpa 2 átok. Az Aranykoronán és a Holdgyöngyön csak 1-1."}, {"id": "r5", "type": "num", "pts": 1, "say": "Számolj, halandó. Az aranyat szeretem számolni.", "q": "Hány sora lesz az eredménynek?", "code": "SELECT kamra_id, SUM(ertek)\nFROM kincsek\nGROUP BY kamra_id\nHAVING SUM(ertek) > 1000;", "ok": 2, "traps": {"5": "Öt kamra van, de a <code>HAVING<\/code> a kis összegű kamrákat kiszűri.", "3": "Nézd meg a 4-es kamrát: a <code>NULL<\/code> értékek kimaradnak, csak a Holdgyöngy 800-a marad, ez nem több 1000-nél.", "14": "Ennyi kincs van, de a <code>GROUP BY<\/code> után kamránként egy sor marad."}, "hint": "Add össze kamránként az értékeket. Az ismeretlen (NULL) értékeket a SUM kihagyja.", "why": "1-es kamra 2450, 2-es 3300: ezek maradnak. A 3-as 540, a 4-es 800, az 5-ösben csak NULL van."}]}, {"id": "null", "title": "Ismeretlen érték: NULL", "intro": "<b class=\"t\">A lámpa súgja<\/b><p>A <code>NULL<\/code> azt jelenti: <b>nincs érték<\/b>. Nem 0, és semmivel sem egyenlő, ezért a <code>= NULL<\/code> soha nem igaz. Helyesen: <code>IS NULL<\/code>, <code>IS NOT NULL<\/code>.<\/p>", "questions": [{"id": "r6", "type": "mc", "pts": 1, "say": "Néhány kincsemnek még senki sem merte megbecsülni az értékét…", "q": "Melyik feltétel adja azokat a kincseket, amelyeknek az értéke ismeretlen (<code>NULL<\/code>)?", "opts": ["<code>ertek = NULL<\/code>", "<code>ertek = 0<\/code>", "<code>ertek IS NULL<\/code>", "<code>ertek = ''<\/code>"], "ok": 2, "fbs": {"0": "Az <code>= NULL<\/code> soha nem igaz: 0 sort kapsz, hibaüzenet nélkül.", "1": "A 0 egy szám: azt jelentené, hogy a kincs semmit sem ér.", "3": "Az <code>''<\/code> üres szöveg, nem hiányzó érték."}, "why": "Hiányzó értéket csak az <code>IS NULL<\/code> talál meg."}, {"id": "r7", "type": "num", "pts": 1, "say": "Ezt a csapdát sokan nem veszik észre. Hehehe.", "q": "Hány sort ad ez a lekérdezés?", "code": "SELECT *\nFROM kincsek\nWHERE ertek = NULL;", "ok": 0, "traps": {"3": "Három kincs értéke valóban ismeretlen, de az <code>= NULL<\/code> soha nem igaz. Ehhez <code>IS NULL<\/code> kellene."}, "hint": "Igaz lehet-e valaha, hogy valami egyenlő a NULL-lal?", "why": "0 sor, és hibaüzenet sincs: ezért alattomos."}, {"id": "r8", "type": "sql", "pts": 2, "say": "Mutasd meg a felbecsülhetetlen kincseimet!", "q": "Melyik kincsek értéke ismeretlen? (a kincs neve)", "expect": "SELECT nev FROM kincsek WHERE ertek IS NULL;", "hint": "<code>WHERE ertek IS NULL<\/code>", "why": "Három: a Szelek tekercse, a Csillagtérkép és a Fekete lámpa."}]}, {"id": "sort", "title": "Rendezés és LIMIT", "intro": "<b class=\"t\">A lámpa súgja<\/b><p>Az <code>ORDER BY<\/code> magában <b>növekvő<\/b> (<code>ASC<\/code>): kicsitől a nagyig. <code>DESC<\/code> = csökkenő. A <code>LIMIT n<\/code> az első n sort tartja meg. Vigyázz: növekvő rendezésnél a <code>NULL<\/code> kerül előre.<\/p>", "questions": [{"id": "r9", "type": "mc", "pts": 1, "say": "A kamráim mélyre nyúlnak. Nagyon mélyre.", "q": "Melyik kamra lesz az első sorban?", "code": "SELECT nev, melyseg\nFROM kamrak\nORDER BY melyseg;", "opts": ["A legsekélyebb", "A legmélyebb", "Amelyik elöl áll a táblában", "Véletlenszerű"], "ok": 0, "fbs": {"1": "Ez a <code>DESC<\/code> lenne. Magában az <code>ORDER BY<\/code> a kisebbel kezd.", "2": "Az <code>ORDER BY<\/code> átrendezi a sorokat.", "3": "A rendezés mindig ugyanazt adja."}, "why": "Növekvő sorrend: a Tükörterem (1-es mélység) kerül előre."}, {"id": "r10", "type": "blank", "say": "A legdrágább kincseim… csak hármat mutatok.", "q": "A 3 legértékesebb kincs, a legértékesebbel kezdve.", "code": "SELECT nev, ertek\nFROM kincsek\nORDER BY ertek {0}\n{1} 3;", "ok": [["DESC"], ["LIMIT"]], "traps": {"ASC|LIMIT": "Az <code>ASC<\/code> a legkisebbel kezdene, ráadásul a <code>NULL<\/code>-okkal. A legnagyobb érték elöl: <code>DESC<\/code>."}, "hint": "Melyik irányba rendezz, hogy a legnagyobb érték legyen elöl? És mi vágja le a végét?"}, {"id": "r11", "type": "sql", "pts": 2, "say": "És most a legolcsóbb. De vigyázz, a lámpa trükközik…", "q": "Melyik a legolcsóbb kincs, amelynek ismert az értéke? (a neve és az értéke, egyetlen sor)", "expect": "SELECT nev, ertek FROM kincsek WHERE ertek IS NOT NULL ORDER BY ertek LIMIT 1;", "hint": "Növekvő rendezésnél a <code>NULL<\/code> kerül előre, ezért előbb szűrd ki: <code>WHERE ertek IS NOT NULL ORDER BY ertek LIMIT 1<\/code>.", "why": "A Rézlámpa, 90 aranyért. <code>IS NOT NULL<\/code> nélkül egy ismeretlen értékű tekercs kerülne előre."}]}, {"id": "order", "title": "A záradékok sorrendje", "intro": "<b class=\"t\">A lámpa súgja<\/b><p><code>SELECT<\/code> → <code>FROM<\/code> → <code>WHERE<\/code> → <code>GROUP BY<\/code> → <code>HAVING<\/code> → <code>ORDER BY<\/code> → <code>LIMIT<\/code><\/p><p><b>S<\/b>ok <b>F<\/b>inom <b>W<\/b>afflit <b>G<\/b>yorsan <b>H<\/b>absolt <b>O<\/b>lga <b>L<\/b>ánya.<\/p>", "questions": [{"id": "r12", "type": "order", "pts": 2, "say": "Összekevertem a varázsigéimet. Rakd őket rendbe!", "q": "Tedd sorba mind a hét záradékot! (a nyilakkal mozgathatod őket)", "items": ["SELECT", "FROM", "WHERE", "GROUP BY", "HAVING", "ORDER BY", "LIMIT"], "start": [5, 0, 6, 2, 4, 1, 3], "hint": "Sok Finom Wafflit…"}, {"id": "r13", "type": "bug", "pts": 1, "say": "Ebben a varázsigében egy sor rossz helyen áll. Melyik?", "q": "Egyetlen sor áll rossz helyen. Melyik az?", "code": "SELECT fajta, COUNT(*)\nFROM kincsek\nORDER BY COUNT(*) DESC\nWHERE ertek > 100\nGROUP BY fajta;", "ok": 2, "fbs": {"3": "A <code>WHERE<\/code> jó helyen van, közvetlenül a <code>FROM<\/code> után. Mi áll előtte, ami nem oda való?", "4": "A <code>GROUP BY<\/code> a <code>WHERE<\/code> után jó helyen van. Melyik sor tartozik a legvégére?"}, "why": "Az <code>ORDER BY<\/code> a végére tartozik: előbb szűrünk és csoportosítunk, a rendezés jön utoljára."}]}, {"id": "link", "title": "A táblákat összekötő oszlop", "intro": "<b class=\"t\">A lámpa súgja<\/b><p>A kapcsolat a <b>hivatkozó oszlop<\/b>: a <code>atkok.kincs_id<\/code> a <code>kincsek.id<\/code>-re, a <code>kincsek.kamra_id<\/code> a <code>kamrak.id<\/code>-re mutat. A szabály: <b>hivatkozó oszlop = a másik tábla id-je<\/b>. Az <code>id = id<\/code> rossz párokat ad.<\/p>", "questions": [{"id": "r14", "type": "blank", "say": "Melyik átok melyik kincsemen ül? Kösd össze, ha tudod!", "q": "Minden átok mellé annak a kincsnek a neve, amelyiken ül.", "code": "SELECT atkok.nev, kincsek.nev\nFROM atkok, kincsek\nWHERE atkok.{0} = kincsek.{1};", "ok": [["kincs_id"], ["id"]], "traps": {"ID|ID": "Az <code>id = id<\/code> az 1-es átkot az 1-es kincshez rakná, nem ahhoz, amelyiken ül. Az átok a <code>kincs_id<\/code> oszlopban mondja meg, melyik kincsről van szó."}, "hint": "Melyik oszlop mondja meg az <code>atkok<\/code> táblában, melyik kincsen ül az átok?"}, {"id": " function svgToStage(x, y){
  const m = DJ.getScreenCTM(), r = STAGE.getBoundingClientRect();
  if (!m) return { x: r.width / 2, y: r.height / 2 };
  const p = new DOMPoint(x, y).matrixTransform(m);
  return { x: p.x - r.left, y: p.y - r.top };
}

/* ---------- particles: ambient sparks, bursts, the sealing vortex, the finale ---------- */
const CV = $("fx"), G = CV.getContext("2d");
let P = [], W = 0, H = 0, DPR = 1, vortex = 0, ambient = true;
function fit(){ const r = STAGE.getBoundingClientRect(); DPR = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; CV.width = W * DPR; CV.height = H * DPR; G.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener("resize", fit);
function spark(x, y, o){ P.push(Object.assign({ x, y, vx: 0, vy: 0, g: 0, life: 0, max: 60, s: 2, c: "#ffd27a", kind: "dot", rot: 0, vr: 0, drag: .985 }, o)); }
function burst(x, y, n, colors, speed, o){
  for (let i = 0; i < n; i++){ const a = Math.random() * Math.PI * 2, v = speed * (.35 + Math.random() * .65);
    spark(x, y, Object.assign({ vx: Math.cos(a) * v, vy: Math.sin(a) * v, max: 50 + Math.random() * 40, s: 1.5 + Math.random() * 3, c: pick(colors) }, o)); }
}
function ring(x, y, color){ spark(x, y, { kind: "ring", max: 40, s: 10, c: color, drag: 1 }); }
function confetti(n){
  const cols = ["#ffe08a", "#f2c14e", "#ffffff", "#c9b6ff", "#ff9bd2", "#9fe6b5"];
  for (let i = 0; i < n; i++) spark(Math.random() * W, -20 - Math.random() * H * .5, { kind: "conf", vx: (Math.random() - .5) * 2, vy: 1 + Math.random() * 2.5, g: .04, max: 260, s: 5 + Math.random() * 5, c: pick(cols), rot: Math.random() * 6, vr: (Math.random() - .5) * .3, drag: .995 });
}
function tick(){
  G.clearRect(0, 0, W, H);
  if (ambient && !reduced && Math.random() < .5){
    const sp = svgToStage(104 + Math.random() * 120, 300 + Math.random() * 130);
    spark(sp.x, sp.y, { vx: (Math.random() - .5) * .4, vy: -.4 - Math.random() * .8, max: 70 + Math.random() * 60, s: .8 + Math.random() * 1.8, c: pick(["#c9b6ff", "#ffd27a", "#9f7bff", "#ff9a6a"]) });
  }
  if (vortex){
    const sp = svgToStage(100, 424);
    for (let k = 0; k < 6; k++){ const a = Math.random() * Math.PI * 2, R = 120 + Math.random() * Math.max(W, H) * .45;
      spark(sp.x + Math.cos(a) * R, sp.y + Math.sin(a) * R, { kind: "vortex", tx: sp.x, ty: sp.y, ang: a, rad: R, max: 120, s: 1.5 + Math.random() * 2.5, c: pick(["#c9b6ff", "#9f7bff", "#ffd27a", "#ffffff"]) }); }
  }
  G.globalCompositeOperation = "lighter";
  P = P.filter(p => {
    p.life++;
    const t = p.life / p.max; if (t >= 1) return false;
    if (p.kind === "vortex"){ p.ang += .09 + (1 - p.rad / 600) * .06; p.rad *= .955; p.x = p.tx + Math.cos(p.ang) * p.rad; p.y = p.ty + Math.sin(p.ang) * p.rad * .7; if (p.rad < 4) return false; }
    else { p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; }
    const alpha = p.kind === "conf" ? Math.min(1, (1 - t) * 3) : 1 - t;
    G.globalAlpha = Math.max(0, alpha);
    if (p.kind === "ring"){ G.strokeStyle = p.c; G.lineWidth = 3 * (1 - t); G.beginPath(); G.arc(p.x, p.y, p.s + t * 120, 0, 7); G.stroke(); }
    else if (p.kind === "conf"){ G.globalCompositeOperation = "source-over"; G.save(); G.translate(p.x, p.y); G.rotate(p.rot); G.fillStyle = p.c; G.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); G.restore(); G.globalCompositeOperation = "lighter"; }
    else if (p.kind === "star"){ G.fillStyle = p.c; G.save(); G.translate(p.x, p.y); G.rotate(p.rot); G.beginPath(); for (let i = 0; i < 10; i++){ const r = i % 2 ? p.s * .4 : p.s; G.lineTo(Math.cos(i * Math.PI / 5) * r, Math.sin(i * Math.PI / 5) * r); } G.fill(); G.restore(); }
    else { G.fillStyle = p.c; G.beginPath(); G.arc(p.x, p.y, p.s * (1 - t * .5), 0, 7); G.fill(); }
    return true;
  });
  G.globalAlpha = 1; G.globalCompositeOperation = "source-over";
  requestAnimationFrame(tick);
}

/* ---------- the seals ---------- */
function runes(){
  $("runes").innerHTML = QS.map((q, i) => `<button type="button" class="rune ${status(q) === "skip" ? "" : status(q)}${i === S.cur && !S.finished ? " cur" : ""}" data-i="${i}" aria-label="${U.qOf(i + 1, N)}" role="listitem"><span>${i + 1}</span></button>`).join("");
  $("runes").setAttribute("aria-disabled", S.finished ? "true" : "false");
  $("runes").querySelectorAll(".rune").forEach(b => b.onclick = () => { if (!S.finished) go(+b.dataset.i); });
  $("sealcount").innerHTML = `${U.seals} <b>${doneCount()}</b> / ${N}`;
  setPower();
}
function igniteRune(i, colors){
  const b = $("runes").children[i]; if (!b) return;
  b.classList.add("ignite");
  const r = b.getBoundingClientRect(), s = STAGE.getBoundingClientRect();
  burst(r.left - s.left + r.width / 2, r.top - s.top + r.height / 2, 22, colors, 3.2);
}

/* ---------- screens ---------- */
function startScreen(){
  DJ.setAttribute("class", "asleep"); hush();
  $("panel").innerHTML = `<div class="card"><div class="kicker">${U.kicker}</div><h1>${U.title}</h1><div class="story">${U.story}</div>
    <ul class="rules">${U.rules.map(r => `<li>${r}</li>`).join("")}</ul>
    <label class="nm" for="nm">${U.name}</label><input class="nm" id="nm" autocomplete="name" placeholder="${U.namePh}" value="${esc(S.name)}">
    <div style="margin-top:14px"><button type="button" class="btn gold big" id="rub">${U.start}</button></div><p class="note" id="startNote" style="color:var(--bad)"></p></div>`;
  runes();
  $("rub").onclick = () => { const n = $("nm").value.trim(); if (!n){ $("startNote").textContent = U.nameFirst; $("nm").focus(); return; }
    S = { name: n, started: Date.now(), ans: {}, done: {}, cur: 0, finished: 0 }; save(); emerge(() => go(0, U.intro)); };
  $("nm").onkeydown = e => { if (e.key === "Enter") $("rub").click(); };
  setTimeout(() => say(U.sleeping, "muffled"), 600);
}
function emerge(then){
  hush();
  DJ.setAttribute("class", "asleep"); void DJ.getBoundingClientRect();
  const sp = svgToStage(100, 424);
  DJ.classList.add("emerge"); DJ.classList.remove("asleep");
  burst(sp.x, sp.y, 70, ["#c9b6ff", "#9f7bff", "#ffd27a", "#ffffff"], 5); ring(sp.x, sp.y, "#c9b6ff");
  setTimeout(() => { DJ.classList.remove("emerge"); then && then(); }, reduced ? 50 : 1300);
}
function go(i, opening){
  if (S.finished) return;
  S.cur = Math.max(0, Math.min(N - 1, i)); save();
  const q = QS[S.cur], first = q.sec.questions[0] === q;
  runes(); card(q, first || status(q) === "skip" && (D(q).tries || 0) >= 1);
  if (!isDone(q)){
    mood("ask", 1150);
    const c = svgToStage(104, 66); ring(c.x, c.y, "#e6b3ff"); burst(c.x, c.y, 18, ["#ffd3ff", "#d04cff", "#ffffff"], 2.5);
    say((opening ? `<i>${opening}</i> ` : "") + (q.say || ""));
  } else say(U.already);
}
function card(q, openRemind){
  const i = QS.indexOf(q), done = isDone(q), d = S.done[q.id] || { tries: 0 };
  $("panel").innerHTML = `<div class="card${done ? " done-lock" : ""}" id="qc">
      <div class="qtop"><span class="qno">${U.qOf(i + 1, N)}</span><span class="chip">${q.sec.title}</span>
        <span class="qnav"><button type="button" id="prevQ" aria-label="${U.prev}"${i === 0 ? " disabled" : ""}>←</button><button type="button" id="nextQ" aria-label="${U.next}"${i === N - 1 ? " disabled" : ""}>→</button></span></div>
      <details class="remind"${openRemind ? " open" : ""}><summary>${U.remind}</summary>${q.sec.intro}</details>
      <div class="qtext">${q.q}</div>
      <div id="qbody">${inner(q)}</div>
      <div class="chk"><button type="button" class="btn gold" id="checkBtn"${done ? " hidden" : ""}>${U.check}</button>
        <button type="button" class="btn ghost" id="revealBtn"${done || d.tries < 2 ? " hidden" : ""}>${U.reveal}</button>
        <button type="button" class="btn" id="goNext"${done ? "" : " hidden"}>${doneCount() === N ? U.toEnd : U.nextRiddle}</button></div>
      <div class="fb" id="fb" aria-live="polite"></div>
    </div>
    <div class="foot"><button type="button" class="btn ghost" id="openTables">${U.tables}</button><span class="grow"></span><span id="finNote"></span><button type="button" class="btn ghost" id="finish">${U.finish}</button></div>`;
  wire(q);
  if (done) showDone(q, false);
  $("prevQ").onclick = () => go(i - 1); $("nextQ").onclick = () => go(i + 1);
  $("checkBtn").onclick = () => check(q); $("revealBtn").onclick = () => reveal(q);
  $("goNext").onclick = nextOpen;
  $("openTables").onclick = openTables; $("finish").onclick = askFinish;
}
function wire(q){
  const el = $("qbody");
  if (q.type === "mc" || q.type === "bug") el.querySelectorAll("input").forEach(x => x.onchange = () => setAns(q.id, +x.value));
  if (q.type === "multi") el.querySelectorAll("input").forEach(x => x.onchange = () => setAns(q.id, [...el.querySelectorAll("input:checked")].map(y => +y.value)));
  if (q.type === "tf") el.querySelectorAll("input").forEach(x => x.onchange = () => { const v = (ans(q.id) || q.items.map(() => null)).slice(); v[+x.name.split("-").pop()] = x.value === "1"; setAns(q.id, v); });
  if (q.type === "order") el.querySelectorAll(".mvb").forEach(b => b.onclick = () => {
    const i = +b.dataset.i, d = +b.dataset.d, cur = (ans(q.id) || q.start.map(k => q.items[k])).slice();
    [cur[i], cur[i + d]] = [cur[i + d], cur[i]]; setAns(q.id, cur); el.innerHTML = inner(q); wire(q);
    el.querySelector(`.mvb[data-i="${i + d}"][data-d="${d}"]`)?.focus() || el.querySelector(`.mvb[data-i="${i + d}"]`)?.focus(); });
  if (q.type === "num") el.querySelector("input").oninput = e => setAns(q.id, e.target.value);
  if (q.type === "blank") el.querySelectorAll("input").forEach(x => x.oninput = () => { const v = (ans(q.id) || q.ok.map(() => "")).slice(); v[+x.dataset.i] = x.value; setAns(q.id, v); });
  if (q.type === "sql"){
    const ta = el.querySelector("textarea"), out = el.querySelector(".out");
    ta.oninput = () => setAns(q.id, ta.value);
    const run = () => { if (!ta.value.trim()){ out.innerHTML = `<div class="err">${U.empty}</div>`; return; }
      const r = runQuery(ta.value); out.innerHTML = r.err ? `<div class="err">${U.sqlErr}: ${esc(r.err)}</div>` : `<div class="meta">${U.rows(r.res.values.length)}</div>${tableHtml(r.res)}`; };
    el.querySelector(".run").onclick = run;
    ta.onkeydown = e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); run(); } };
    if (ans(q.id)) run();
  }
  el.querySelectorAll("input[type=text]").forEach(x => x.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); $("checkBtn").click(); } });
}
function fb(k, html){ const f = $("fb"); f.className = "fb " + k; f.innerHTML = html; }
function check(q){
  if (S.finished || isDone(q)) return;
  if (!answered(q)){ fb("bad", U.answerFirst); say(U.impatient); return; }
  const d = D(q); d.tries++;
  if (q.type === "sql") $("qbody").querySelector(".run").click();
  const g = grade(q), m = maxOf(q);
  if (g === m){ d.ok = true; save(); win(q); }
  else {
    save();
    fb(g ? "part" : "bad", `<b>${g ? U.partly(g, m) : U.notYet}</b> ${tipFor(q) || q.hint || U.tryAgain}`);
    if (d.tries >= 2) $("revealBtn").hidden = false;
    mood("laugh", 1400); say(pick(U.laughs), "bad"); taunt(U.ha, 3);
    if (innerWidth < 980) STAGE.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
  }
}
function reveal(q){
  if (S.finished || isDone(q)) return;
  D(q).rev = true; save();
  mood("laugh", 1400); say(U.gloat, "bad");
  showDone(q, true); runes(); igniteRune(QS.indexOf(q), ["#9a6a32", "#f3d7a8"]);
  if (doneCount() === N) setTimeout(finale, 1600);
}
function win(q){
  showDone(q, true); runes();
  const i = QS.indexOf(q), c = svgToStage(200, 240);
  mood("hurt", 1000); say(pick(U.hurts), "good");
  burst(c.x, c.y, 60, ["#ffe08a", "#f2c14e", "#ffffff", "#ffb84a"], 7); ring(c.x, c.y, "#ffe08a");
  for (let k = 0; k < 8; k++) spark(c.x, c.y, { kind: "star", vx: (Math.random() - .5) * 8, vy: -2 - Math.random() * 5, g: .12, max: 70, s: 6 + Math.random() * 5, c: "#ffe08a", vr: .1 });
  igniteRune(i, status(q) === "first" ? ["#ffe08a", "#ffffff", "#f2c14e"] : ["#ffffff", "#c9d3e6"]);
  if (innerWidth < 980) STAGE.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
  if (doneCount() === N) setTimeout(finale, 1500);
}
function showDone(q, fresh){
  const d = S.done[q.id];
  $("qc").classList.add("done-lock");
  $("qbody").querySelectorAll("input,select,textarea,button.mvb").forEach(x => x.disabled = true);
  $("checkBtn").hidden = true; $("revealBtn").hidden = true;
  const head = d.rev ? U.solutionH : d.tries === 1 ? U.rightFirst : U.right;
  fb(d.rev ? "part" : "ok", `<b>${head}</b>${d.rev ? `<div class="sol">${solutionOf(q)}</div>` : ""}${q.why ? `<p>${q.why}</p>` : ""}`);
  const nx = $("goNext"); nx.hidden = doneCount() === N && fresh; nx.textContent = doneCount() === N ? U.toEnd : U.nextRiddle;
  if (fresh && doneCount() < N) setTimeout(() => nx.focus({ preventScroll: true }), 50);
}
function nextOpen(){
  if (doneCount() === N) return results();
  for (let k = 1; k <= N; k++){ const j = (S.cur + k) % N; if (!isDone(QS[j])) return go(j); }
}
let finT = 0;
function askFinish(){
  const missing = N - doneCount();
  if (Date.now() - finT > 4000){ finT = Date.now(); $("finNote").textContent = U.confirm(missing); $("finish").textContent = U.finishSure; return; }
  S.finished = Date.now(); save();
  if (doneCount() === N) finale(); else { mood("laugh", 1600); say(U.leftEarly, "bad"); taunt(U.ha, 4); results(); }
}

/* ---------- the finale: twenty seals pull him back into the lamp ---------- */
function finale(){
  if (!S.finished){ S.finished = Date.now(); save(); }
  runes(); hush();
  $("panel").innerHTML = "";
  if (innerWidth < 980) STAGE.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
  const T = reduced ? [0, 50, 100, 150, 200] : [0, 1300, 3000, 3350, 5200];
  say(U.noo, "bad");
  DJ.classList.remove("ask", "hurt", "laugh"); DJ.classList.add("sealing");
  setTimeout(() => { vortex = 1; hush(); }, T[1] - 500);
  setTimeout(() => { DJ.classList.add("gone"); }, T[1]);
  setTimeout(() => { vortex = 0; DJ.classList.remove("sealing"); DJ.classList.add("shut");
    const sp = svgToStage(212, 450); burst(sp.x, sp.y, 160, ["#ffe08a", "#ffffff", "#f2c14e", "#ffb84a", "#c9b6ff"], 11); ring(sp.x, sp.y, "#ffffff"); ring(sp.x, sp.y, "#ffe08a");
    for (let k = 0; k < 30; k++) spark(sp.x, sp.y, { kind: "star", vx: (Math.random() - .5) * 14, vy: -4 - Math.random() * 9, g: .14, max: 110, s: 6 + Math.random() * 7, c: pick(["#ffe08a", "#ffffff"]), vr: .12 });
  }, T[2]);
  setTimeout(() => {
    STAGE.classList.add("sealed"); DJ.classList.add("sealed-glow");
    QS.forEach((q, i) => setTimeout(() => igniteRune(i, ["#ffe08a", "#ffffff"]), i * 70));
    const f = document.createElement("div"); f.className = "finale"; f.id = "finaleBox";
    f.innerHTML = `<h2>${[...U.finaleTitle].map((ch, i) => `<span style="animation-delay:${(i * .05).toFixed(2)}s">${ch === " " ? "&nbsp;" : esc(ch)}</span>`).join("")}</h2><p>${U.finaleSub}</p>`;
    $("finaleBox")?.remove(); STAGE.appendChild(f);
    confetti(reduced ? 0 : 160);
    const fw = setInterval(() => { if (reduced) return clearInterval(fw); const x = W * (.15 + Math.random() * .7), y = H * (.12 + Math.random() * .4);
      burst(x, y, 50, pick([["#ffe08a", "#ffffff"], ["#c9b6ff", "#ffffff"], ["#ff9bd2", "#ffe08a"], ["#9fe6b5", "#ffffff"]]), 6); }, 420);
    setTimeout(() => clearInterval(fw), 4200);
  }, T[3]);
  setTimeout(() => { results(); setTimeout(() => say(U.muffled, "muffled"), 600); }, T[4]);
}
function sealedState(){
  DJ.setAttribute("class", "gone shut sealed-glow"); STAGE.classList.add("sealed"); hush(); setTimeout(() => say(U.muffled, "muffled"), 400);
}

/* ---------- results + export ---------- */
function results(){
  runes();
  const cnt = k => QS.filter(q => status(q) === k).length;
  const rows = CFG.sections.map(sec => `<tr><td>${sec.title}</td><td class="n">${sec.questions.filter(q => status(q) === "first").length} / ${sec.questions.length}</td></tr>`).join("");
  $("panel").innerHTML = `<div class="card result"><div class="kicker">${doneCount() === N ? U.sealedK : U.escapedK}</div>
    <div class="big">${cnt("first")} / ${N}</div><div class="sub">${U.pracSub(cnt("first"), cnt("later"), cnt("rev"), cnt("skip"))}</div>
    <table class="sumtbl"><thead><tr><th></th><th>${U.firstTry}</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="export"><h3>${U.handH}</h3><ol>${U.handSteps.map(s => `<li>${s}</li>`).join("")}</ol>
    <div class="row"><button type="button" class="btn gold" id="saveTxt">${U.save}</button><button type="button" class="btn ghost" id="copyTxt">${U.copy}</button>
    ${doneCount() === N ? `<button type="button" class="btn ghost" id="replay">${U.replay}</button>` : ""}</div><p class="note" id="exNote" aria-live="polite"></p></div></div>`;
  $("saveTxt").onclick = saveTxt; $("copyTxt").onclick = copyTxt;
  if ($("replay")) $("replay").onclick = () => { STAGE.classList.remove("sealed"); $("finaleBox")?.remove(); DJ.setAttribute("class", "asleep"); P = [];
    emerge(() => { say(U.intro); setTimeout(finale, 1600); }); };
}
const mmss = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const plain = s => String(s).replace(/<[^>]+>/g, "").replace(/&gt;/g, ">").replace(/&lt;/g, "<").replace(/&amp;/g, "&");
function answerText(q){
  const a = ans(q.id);
  if (q.type !== "order" && (a == null || a === "" || (Array.isArray(a) && !a.length))) return U.none;
  switch (q.type){
    case "mc": return plain(q.opts[a]);
    case "multi": return a.map(i => plain(q.opts[i])).join(", ");
    case "tf": return q.items.map((_, i) => a[i] === true ? U.t : a[i] === false ? U.f : "-").join(", ");
    case "order": return (a || q.start.map(i => q.items[i])).join(" → ");
    case "num": return String(a).trim();
    case "blank": return a.map(x => x || "-").join(" | ");
    case "bug": return U.line(a + 1);
    case "sql": return "\n    " + a.trim().replace(/\n/g, "\n    ");
  }
}
function report(){
  const end = S.finished || Date.now();
  const L = [CFG.reportTitle, "", `${U.rName}: ${S.name}`, `${U.rDate}: ${new Date(end).toLocaleString(CFG.lang === "hu" ? "hu-HU" : "en-GB")}`,
    `${U.rTime}: ${mmss(end - S.started)}`, `${U.rFirst}: ${QS.filter(q => status(q) === "first").length} / ${N}`, `${U.seals}: ${doneCount()} / ${N}`, ""];
  CFG.sections.forEach(sec => { L.push("== " + plain(sec.title));
    sec.questions.forEach(q => L.push(`${QS.indexOf(q) + 1}. [${U.status(status(q), (S.done[q.id] || {}).tries || 0)}] ${answerText(q)}`)); L.push(""); });
  return L.join("\n");
}
function fileName(){ return `${CFG.filePrefix}-${S.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase() || "valasz"}.txt`; }
function saveTxt(){
  try { const b = new Blob([report()], { type: "text/plain;charset=utf-8" }), u = URL.createObjectURL(b), a = document.createElement("a");
    a.href = u; a.download = fileName(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1500);
    $("exNote").textContent = U.saved(fileName()); } catch(e){ $("exNote").textContent = U.saveBlocked; }
}
function copyTxt(){ navigator.clipboard.writeText(report()).then(() => $("exNote").textContent = U.copied, () => $("exNote").textContent = U.copyBlocked); }

    return `<div class="dt"><h4>${t}<span>${U.rows(r.values.length)}</span></h4>${tableHtml(r)}</div>`; }).join("");
  db.close(); $("tables").showModal();
}
$("tablesClose").onclick = () => $("tables").close();
$("tables").addEventListener("click", e => { if (e.target === $("tables")) $("tables").close(); });

/* ---------- boot ---------- */
function boot(){
  fit(); requestAnimationFrame(tick); wander();
  if (typeof initSqlJs !== "function"){ $("panel").innerHTML = `<div class="err">${U.engFail}</div>`; return; }
