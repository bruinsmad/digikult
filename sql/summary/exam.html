<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>SQL exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* SQL exam: one part at a time, never back. Each student gets one random variant of every part, in a random order,
   with shuffled options. Calm page: a header with the name, progress; the part below; tables on request. */
:root{
  --bg:#f3f1eb; --card:#fff; --ink:#1d2232; --muted:#646b7d; --line:#e2ddd0; --accent:#2b4c9a; --accent-2:#e8eefb;
  --warn:#9a5b00; --warn-bg:#fdf1d8; --bad:#a3243b; --bad-bg:#fbe5e8; --good:#1f7a4a;
  --code:#1e2235; --code-ink:#eef0fa;
  --f-body:"Atkinson Hyperlegible", system-ui, sans-serif; --f-mono:"JetBrains Mono", ui-monospace, monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--f-body)}
a{color:inherit}
code,pre,textarea{font-family:var(--f-mono)}
:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}

.topline{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left));font-size:14px;color:var(--muted)}
.crumb a{text-decoration:none}.crumb a:hover{text-decoration:underline;color:var(--ink)}
.langlink{margin-left:auto;font:700 14px var(--f-body);color:var(--ink);border:1.5px solid var(--line);border-radius:4px;padding:3px 10px;text-decoration:none;background:#fff}

.bar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.bar h1{margin:0;font:700 17px var(--f-body);color:var(--accent)}
.bar .who{color:var(--muted);font-size:14px}
.bar .grow{flex:1}
.prog{display:flex;gap:4px;align-items:center}
.prog i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.prog i.done{background:var(--accent)}
.prog i.cur{background:#f0b429}
.prog span{font:700 13px var(--f-mono);color:var(--muted);margin-left:6px}
.clock{font:700 18px var(--f-mono);padding:4px 10px;border-radius:8px;background:var(--accent-2);color:var(--accent);min-width:78px;text-align:center}
.clock.low{background:var(--warn-bg);color:var(--warn)}
.clock.crit{background:var(--bad-bg);color:var(--bad);animation:tick 1s steps(2) infinite}
@keyframes tick{50%{opacity:.6}}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:9px;padding:10px 18px;font:700 16px var(--f-body);background:var(--accent);color:#fff}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:#fff;color:var(--accent);box-shadow:inset 0 0 0 1.5px #c9d3ea}
.btn.small{padding:6px 12px;font-size:14px}
.btn.warn{background:#c26a00}

main{max-width:880px;margin:0 auto;padding:18px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:0 2px 0 rgba(0,0,0,.03)}
.card h2{margin:0 0 6px;font:700 28px/1.2 var(--f-body)}
.kicker{font:700 12.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.rules{padding-left:22px;margin:12px 0 16px}
.rules li{margin:5px 0}
label.nm{display:block;font-weight:700;margin:12px 0 6px}
input.nm{width:100%;max-width:380px;font:inherit;padding:10px 12px;border:1.5px solid #c9c2b0;border-radius:8px}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 4px}
.facts div{background:var(--accent-2);border-radius:10px;padding:8px 12px;font-size:14px}
.facts b{display:block;font-size:20px;color:var(--accent)}

.phead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.pno{font:700 14px var(--f-mono);color:var(--muted)}
.ptitle{font:700 14px var(--f-body);color:var(--accent);background:var(--accent-2);border-radius:999px;padding:2px 10px}
.ppts{margin-left:auto;font:700 14px var(--f-body);color:var(--muted)}
.qtext{font:700 19px/1.45 var(--f-body);margin:10px 0 14px}
.qtext code,.opt code,.tf code{background:#efece3;padding:0 4px;border-radius:4px;font-size:.92em}
pre.code{background:var(--code);color:var(--code-ink);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.55;overflow:auto;margin:0 0 14px}
.code .k{color:#ffd27a;font-weight:700}.code .f{color:#ff9fd4}.code .s{color:#a6ebbd}.code .nm{color:#9fd0ff}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff}
.opt:hover{border-color:#b8c4e4}
.opt input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-2)}
ol.order{list-style:none;padding:0;margin:0;display:grid;gap:6px}
ol.order li{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;font:600 15px var(--f-mono)}
ol.order .ix{color:var(--muted);width:22px;font-weight:400}
ol.order .mv{margin-left:auto;display:flex;gap:4px}
.mvb{width:34px;height:30px;border-radius:7px;border:1.5px solid #c9c2b0;background:#faf8f2;font-weight:700}
.mvb[disabled]{opacity:.3}
.num input{font:700 20px var(--f-mono);width:150px;padding:8px 12px;border:1.5px solid #c9c2b0;border-radius:8px}
pre.code input{font:700 15px var(--f-mono);width:11ch;padding:1px 6px;border:0;border-bottom:2px dashed #ffd27a;background:#2e3350;color:#fff6d6;border-radius:4px}
.lines{background:var(--code);border-radius:10px;padding:8px 6px;overflow:auto}
.lines label{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:7px;cursor:pointer;color:var(--code-ink);font:15px/1.5 var(--f-mono);white-space:pre}
.lines label:hover{background:rgba(255,255,255,.06)}
.lines input{accent-color:#ffd27a}
.lines .ln{color:#8f95b0;width:18px;text-align:right}
.lines label:has(input:checked){background:rgba(255,210,122,.16);outline:1.5px solid rgba(255,210,122,.6)}
.lines .k{color:#ffd27a;font-weight:700}.lines .f{color:#ff9fd4}.lines .s{color:#a6ebbd}.lines .nm{color:#9fd0ff}
.sqlbox textarea{width:100%;min-height:150px;font-size:15.5px;line-height:1.55;padding:12px 14px;border-radius:10px;border:1.5px solid #c9c2b0;background:#fffefb;color:var(--ink);resize:vertical}
.row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted)}
.out{margin-top:10px}
.out .meta{font:700 13px var(--f-mono);color:var(--muted);margin:6px 0}
.out .err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:8px 10px;font:14px var(--f-mono)}
.tbl{overflow:auto;max-height:300px;border:1px solid var(--line);border-radius:8px;background:#fff}
.tbl table{border-collapse:collapse;width:100%;font:14px var(--f-mono)}
.tbl th{position:sticky;top:0;background:var(--accent-2);text-align:left;padding:5px 8px;color:var(--accent)}
.tbl td{padding:4px 8px;border-top:1px solid #f0ece2;white-space:nowrap}
.tbl td.n{text-align:right}
.tbl td.null{color:#9a93b0;font-style:italic}
details.schema{background:#faf8f3;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 16px}
details.schema summary{cursor:pointer;font-weight:700;color:var(--accent)}
.sch{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:8px}
.st{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.st h5{margin:0 0 4px;font:700 14px var(--f-mono);color:var(--accent)}
.st div{font-size:13px;line-height:1.35;margin:3px 0;color:#3b4152}
.st b{font:700 13px var(--f-mono)}
.st .fk b{color:#1d6fa5}
.st code{background:#efece3;padding:0 3px;border-radius:3px}
.lk{margin-top:8px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.lk code{color:#1d6fa5;background:#eaf3fa;padding:1px 5px;border-radius:4px}
.lk .allrows{margin-left:auto;background:none;border:0;color:var(--accent);text-decoration:underline;font-size:13.5px;padding:0}
.foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.foot .grow{flex:1}
.foot #next{margin-left:auto}
.foot .warnline{color:var(--warn);font-weight:700;font-size:14px}
dialog#tables{border:0;border-radius:14px;padding:0;max-width:min(1040px,96vw);width:96vw;max-height:88vh;background:#fff;color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog#tables::backdrop{background:rgba(20,22,35,.45)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.dlg-head h2{margin:0;font:700 19px var(--f-body);color:var(--accent)}
.dlg-head .btn{margin-left:auto}
.dlg-body{padding:14px 18px 20px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.dt h4{margin:0 0 6px;font:700 15px var(--f-mono);color:var(--accent);display:flex;justify-content:space-between}
.dt h4 span{font:400 13px var(--f-body);color:var(--muted)}
.result .big{font:700 clamp(46px,9vw,72px)/1 var(--f-body);color:var(--accent);text-align:center;margin-top:8px}
.result .sub{text-align:center;color:var(--muted);margin:6px 0 16px}
.export h3{font:700 18px var(--f-body);margin:16px 0 6px}
.export ol{padding-left:22px;margin:6px 0 12px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-weight:700;margin-bottom:12px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:14px}
@media (max-width:600px){ .card{padding:16px} .bar-in{gap:8px;flex-wrap:nowrap} .bar h1{font-size:15px} .bar .who,.prog i{display:none} .clock{min-width:0;font-size:16px} .qtext{font-size:17.5px} }
</style>
</head>

8);\nINSERT INTO screenings VALUES (6,5,'Friday',2,64);\nINSERT INTO screenings VALUES (7,11,'Friday',3,47);\nINSERT INTO screenings VALUES (8,3,'Friday',2,59);\nINSERT INTO screenings VALUES (9,13,'Friday',1,93);\nINSERT INTO screenings VALUES (10,4,'Saturday',1,97);\nINSERT INTO screenings VALUES (11,10,'Saturday',2,81);\nINSERT INTO screenings VALUES (12,7,'Saturday',2,76);\nINSERT INTO screenings VALUES (13,8,'Saturday',3,54);\nINSERT INTO screenings VALUES (14,1,'Saturday',1,70);\nINSERT INTO screenings VALUES (15,5,'Sunday',2,90);\nINSERT INTO screenings VALUES (16,12,'Sunday',3,33);\nINSERT INTO screenings VALUES (17,13,'Sunday',1,NULL);\nINSERT INTO screenings VALUES (18,2,'Sunday',3,25);\nINSERT INTO screenings VALUES (19,10,'Sunday',2,NULL);\nINSERT INTO screenings VALUES (20,14,'Sunday',1,40);", "sections": [{"id": "where", "title": "Conditions: WHERE, AND, OR", "pts": 2, "variants": [{"type": "num", "q": "How many rows does this query give?", "code": "SELECT title\nFROM films\nWHERE genre = 'drama' AND year > 2010;", "ok": 2, "id": "where1"}, {"type": "num", "q": "How many rows does this query give?", "code": "SELECT title\nFROM films\nWHERE length < 100 AND genre = 'comedy';", "ok": 3, "id": "where2"}, {"type": "num", "q": "How many rows does this query give?", "code": "SELECT title\nFROM films\nWHERE year >= 2015 AND length > 100;", "ok": 4, "id": "where3"}, {"type": "num", "q": "How many rows does this query give?", "code": "SELECT title\nFROM films\nWHERE genre = 'action' OR genre = 'horror';", "ok": 5, "id": "where4"}, {"type": "num", "q": "How many rows does this query give?", "code": "SELECT title\nFROM films\nWHERE rating >= 7;", "ok": 6, "id": "where5"}, {"type": "num", "q": "How many rows does this query give?", "code": "SELECT title\nFROM films\nWHERE length > 110;", "ok": 5, "id": "where6"}, {"type": "num", "q": "How many rows does this query give?", "code": "SELECT title\nFROM films\nWHERE year < 2012 AND length > 100;", "ok": 2, "id": "wher /* ---------- randomness: one variant per part, parts in random order, options shuffled ---------- */
function rnd(n){ const a = new Uint32Array(1); (self.crypto || window.msCrypto).getRandomValues(a); return a[0] % n; }
function shuffled(n){ const p = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--){ const j = rnd(i + 1); [p[i], p[j]] = [p[j], p[i]]; } return p; }
function makePlan(){
  return shuffled(N).map(si => {
    const sec = CFG.sections[si], vi = rnd(sec.variants.length), q = sec.variants[vi], p = { s: si, v: vi };
    if (q.type === "mc" || q.type === "multi") p.perm = shuffled(q.opts.length);
    if (q.type === "order"){ let st; do { st = shuffled(q.items.length); } while (st.filter((x, i) => x === i).length > 1); p.start = st; }
    return p;
  });
}
const partOf = k => { const p = S.plan[k], sec = CFG.sections[p.s]; return { p, sec, q: sec.variants[p.v] }; };

/* ---------- SQL ---------- */
function freshDb(){ const db = new SQL.Database(); db.run(CFG.seed); return db; }
function runQuery(q){ const db = freshDb(); try { const r = db.exec(q); return { res: r.length ? r[r.length - 1] : { columns: [], values: [] } }; } catch(e){ return { err: e.message }; } finally { db.close(); } }
function hl(code){
  return esc(code).replace(/('[^']*')|\b(COUNT|SUM|AVG|MIN|MAX)\b|\b(\d+)\b|\b(SELECT|FROM|WHERE|GROUP BY|HAVING|ORDER BY|LIMIT|AND|OR|NOT|LIKE|IS|NULL|ASC|DESC|AS)\b/g,
    (m, s, f, n, k) => s ? `<span class="s">${s}</span>` : f ? `<span class="f">${f}</span>` : n ? `<span class="nm">${n}</span>` : `<span class="k">${k}</span>`);
}
function tableHtml(r){
  if (!r.columns.length) return `<p class="note">${U.noRows}</p>`;
  return `<div class="tbl"><table><thead><tr>${r.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${r.values.map(row => "<tr>" + row.map(v =>
    v === null ? `<td class="null">NULL</td>` : `<td class="${typeof v === "number" ? "n" : ""}">${esc(v)}</td>`).join("") + "</tr>").join("")}</tbody></table></div>`;
}
const normV = v => v === null ? "∅" : typeof v === "number" ? String(Math.round(v * 1000) / 1000) : String(v).trim().toLowerCase();
function matchCols(got, exp){
  if (!got || got.values.length !== exp.values.length) return null;
  const col = (r, i) => r.values.map(row => normV(row[i])).sort().join("\u0001");
  const have = got.columns.map((_, i) => col(got, i)), used = new Set(), map = [];
  for (let i = 0; i < exp.columns.length; i++){ const w = col(exp, i), j = have.findIndex((h, k) => !used.has(k) && h === w); if (j < 0) return null; used.add(j); map.push(j); }
  return map;
}

/* ---------- answers + grading (shown to nobody during the exam) ---------- */
const nb = s => String(s || "").trim().replace(/\s+/g, " ").replace(/;$/, "").toUpperCase();
const A = k => S.ans[k];
function setA(k, v){ const n = load(); if (n && n.started === S.started && (n.pos !== k || n.finished)) return; S.ans[k] = v; save(); }
function answered(k){
  const { q } = partOf(k), a = A(k);
  if (q.type === "order") return Array.isArray(a);
  if (a == null || a === "") return false;
  if (Array.isArray(a)) return q.type === "multi" ? a.length > 0 : a.every(x => String(x || "").trim() !== "");
  return String(a).trim() !== "";
}
function grade(k){
  const { p, sec, q } = partOf(k), a = A(k), P = sec.pts;
  switch (q.type){
    case "mc": case "bug": return a === q.ok ? P : 0;
    case "multi": { if (!Array.isArray(a) || !a.length) return 0; const want = new Set(q.ok), got = new Set(a);
      const diff = [...want].filter(x => !got.has(x)).length + [...got].filter(x => !want.has(x)).length; return diff === 0 ? P : diff === 1 ? P - 1 : 0; }
    case "num": return a != null && String(a).trim() !== "" && Number(String(a).trim().replace(",", ".")) === q.ok ? P : 0;
    case "blank": return Math.round(q.ok.reduce((s, alts, i) => s + (a && alts.some(x => nb(x) === nb(a[i])) ? 1 : 0), 0) * P / q.ok.length);
    case "order": { const cur = a || p.start.map(i => q.items[i]); const right = cur.filter((x, i) => x === q.items[i]).length;
      return right === q.items.length ? P : right >= q.items.length - 2 ? P - 1 : 0; }
    case "sql": { if (!a || !a.trim()) return 0; const got = runQuery(a), exp = runQuery(q.expect); if (got.err) return 0;
      const map = matchCols(got.res, exp.res); if (!map) return 0;
      if (q.ordered != null){ const k2 = q.ordered; if (got.res.values.map(r => normV(r[map[k2]])).join("|") !== exp.res.values.map(r => normV(r[k2])).join("|")) return P - 1; }
      return P; }
  }
  return 0;
}
const maxPts = () => CFG.sections.reduce((s, x) => s + x.pts, 0);

/* ---------- rendering a part ---------- */
function body(k){
  const { p, q } = partOf(k), a = A(k);
  switch (q.type){
    case "mc": case "multi": {
      const t = q.type === "mc" ? "radio" : "checkbox", sel = i => q.type === "mc" ? a === i : Array.isArray(a) && a.includes(i);
      return `${q.code ? `<pre class="code">${hl(q.code)}</pre>` : ""}<div class="opts">${p.perm.map(i =>
        `<label class="opt"><input type="${t}" name="o" value="${i}"${sel(i) ? " checked" : ""}><span>${q.type === "multi" ? esc(q.opts[i]) : q.opts[i]}</span></label>`).join("")}</div>`;
    }
    case "order": {
      const cur = a || p.start.map(i => q.items[i]);
      return `<ol class="order">${cur.map((it, i) => `<li><span class="ix">${i + 1}.</span>${esc(it)}<span class="mv">
        <button type="button" class="mvb" data-i="${i}" data-d="-1" aria-label="${U.up}"${i === 0 ? " disabled" : ""}>↑</button>
        <button type="button" class="mvb" data-i="${i}" data-d="1" aria-label="${U.down}"${i === cur.length - 1 ? " disabled" : ""}>↓</button></span></li>`).join("")}</ol>`;
    }
    case "num":
      return `<pre class="code">${hl(q.code)}</pre><div class="num"><input type="text" inputmode="decimal" autocomplete="off" aria-label="${U.answer}" value="${a != null ? esc(a) : ""}" placeholder="${U.number}"></div>`;
    case "blank": { let n = 0;
      const code = hl(q.code.replace(/\{(\d)\}/g, (m, d) => "⟦" + "ABCDEFGHI"[d] + "⟧")).replace(/⟦[A-I]⟧/g, () => { const i = n++;
        return `<input type="text" data-i="${i}" autocomplete="off" spellcheck="false" aria-label="${U.blank(i + 1)}" value="${a && a[i] ? esc(a[i]) : ""}">`; });
      return `<pre class="code">${code}</pre>`; }
    case "bug":
      return `<div class="lines">${q.code.split("\n").map((ln, i) => `<label><input type="radio" name="o" value="${i}"${a === i ? " checked" : ""}><span class="ln">${i + 1}</span><span>${hl(ln)}</span></label>`).join("")}</div>`;
    case "sql":
      return `<div class="sqlbox"><textarea id="sql" spellcheck="false" aria-label="${U.query}" placeholder="SELECT …">${a ? esc(a) : ""}</textarea>
        <div class="row"><button type="button" class="btn ghost" id="run">${U.run}</button><span class="hint">${U.runHint}</span></div><div class="out" id="out" aria-live="polite"></div></div>`;
  }
}
function wire(k){
  const { p, q } = partOf(k), el = $("qbody");
  if (q.type === "mc" || q.type === "bug") el.querySelectorAll("input").forEach(x => x.onchange = () => setA(k, +x.value));
  if (q.type === "multi") el.querySelectorAll("input").forEach(x => x.onchange = () => setA(k, [...el.querySelectorAll("input:checked")].map(y => +y.value)));
  if (q.type === "order"){ if (!Array.isArray(A(k))) setA(k, p.start.map(i => q.items[i]));
    el.querySelectorAll(".mvb").forEach(b => b.onclick = () => { const i = +b.dataset.i, d = +b.dataset.d, cur = A(k).slice();
      [cur[i], cur[i + d]] = [cur[i + d], cur[i]]; setA(k, cur); el.innerHTML = body(k); wire(k);
      (el.querySelector(`.mvb[data-i="${i + d}"][data-d="${d}"]`) || el.querySelector(`.mvb[data-i="${i + d}"]`))?.focus(); }); }
  if (q.type === "num") el.querySelector("input").oninput = e => setA(k, e.target.value);
  if (q.type === "blank") el.querySelectorAll("input").forEach(x => x.oninput = () => { const v = (A(k) || q.ok.map(() => "")).slice(); v[+x.dataset.i] = x.value; setA(k, v); });
  if (q.type === "sql"){ const ta = $("sql");
    ta.oninput = () => setA(k, ta.value);
    const run = () => { if (!ta.value.trim()){ $("out").innerHTML = `<div class="err">${U.empty}</div>`; return; }
      const r = runQuery(ta.value); $("out").innerHTML = r.err ? `<div class="err">${U.sqlErr}: ${esc(r.err)}</div>` : `<div class="meta">${U.rows(r.res.values.length)}</div>${tableHtml(r.res)}`; };
    $("run").onclick = run; ta.onkeydown = e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); run(); } };
    if (A(k)) run(); }
  el.querySelectorAll("input[type=text]").forEach(x => x.onkeydown = e => { if (e.key === "Enter") e.preventDefault(); });
}
function schemaHtml(){
  const sc = CFG.schema, open = S.schemaOpen != null ? S.schemaOpen : innerWidth >= 700;
  const tbl = t => `<div class="st"><h5>${t.name}</h5>${t.cols.map(([c, d, fk]) => `<div class="${fk ? "fk" : ""}">${c === "id" ? "🔑 " : fk ? "→ " : ""}<b>${c}</b>: ${d}${fk ? ` (<code>${fk}</code>)` : ""}</div>`).join("")}</div>`;

    <div class="row" style="margin-top:14px"><button type="button" class="btn" id="go">${U.start}</button></div><p class="note" id="startNote" style="color:var(--bad)"></p></div>`;
  $("go").onclick = () => { const n = $("nm").value.trim(); if (!n){ $("startNote").textContent = U.nameFirst; $("nm").focus(); return; }
    S = { name: n, started: Date.now(), plan: makePlan(), pos: 0, ans: {}, finished: 0, timedOut: false, v: 1 }; save(); part(); clock(); };
  $("nm").onkeydown = e => { if (e.key === "Enter") $("go").click(); };
}
let goT = 0;
function part(){
  goT = 0;
  const k = S.pos, { sec, q } = partOf(k);
  bar();
  $("main").innerHTML = `<div class="card" id="pc">
      <div class="phead"><span class="pno">${U.partOf(k + 1, N)}</span><span class="ptitle">${sec.title}</span><span class="ppts">${U.ptsN(sec.pts)}</span></div>
      <div class="qtext">${q.q}</div>
      ${schemaHtml()}
      <div id="qbody">${body(k)}</div>
      <div class="foot"><span class="warnline" id="goNote" aria-live="polite"></span><span class="grow"></span>
        <button type="button" class="btn" id="next">${k === N - 1 ? U.handIn : U.next}</button></div>
    </div>`;
  wire(k);
  $("schema").ontoggle = () => { S.schemaOpen = $("schema").open; save(); };
  $("allRows").onclick = openTables;
  $("next").onclick = () => {
    if (Date.now() - goT > 5000){ goT = Date.now();
      $("goNote").textContent = answered(k) ? (k === N - 1 ? U.sureHand : U.sureNext) : U.sureEmpty;
      $("next").textContent = U.confirm; $("next").classList.add("warn"); return; }
    goT = 0;
    if (k === N - 1) return finish();
    S.pos = k + 1; save(); part(); scrollTo({ top: 0 });
  };
  scrollTo({ top: 0 });
}
function bar(){
  $("bar").hidden = false; $("barTitle").textContent = U.short; $("who").textContent = S.name; $("openTables").textContent = U.tables;
  $("prog").innerHTML = S.plan.map((_, i) => `<i class="${i < S.pos || S.finished ? "done" : i === S.pos && !S.finished ? "cur" : ""}"></i>`).join("") + `<span>${Math.min(S.pos + 1, N)}/${N}</span>`;
}
/* no countdown on screen: only the time used goes on the answer sheet */
let clockT = 0;
function clock(){}
function finish(){
  if (S.finished) return;
  S.finished = Date.now(); S.timedOut = false;
  S.score = S.plan.reduce((s, _, k) => s + grade(k), 0); save();
  clearInterval(clockT); results();
}

/* ---------- after handing in: the score only, and the answer sheet ---------- */
function results(){
  bar();
  const max = maxPts(), pct = Math.round(S.score / max * 100);
  $("main").innerHTML = `<div class="card result"><div class="kicker">${U.handedIn}</div><h2>${esc(S.name)}</h2>
    <div class="big">${S.score} / ${max}</div><div class="sub">${U.scoreSub(pct, mmss(S.finished - S.started))}</div>
    <div class="export"><h3>${U.handH}</h3><ol>${U.handSteps.map(s => `<li>${s}</li>`).join("")}</ol>
      <div class="row"><button type="button" class="btn" id="saveTxt">${U.save}</button><button type="button" class="btn ghost" id="copyTxt">${U.copy}</button></div>
      <p class="note" id="exNote" aria-live="polite"></p></div></div>`;
  $("saveTxt").onclick = saveTxt; $("copyTxt").onclick = copyTxt;
}
const mmss = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const plain = s => String(s).replace(/<[^>]+>/g, "").replace(/&gt;/g, ">").replace(/&lt;/g, "<").replace(/&amp;/g, "&").replace(/&quot;/g, '"');
function answerText(k){
  const { p, q } = partOf(k), a = A(k);
  if (q.type !== "order" && (a == null || a === "" || (Array.isArray(a) && !a.length))) return U.none;
  switch (q.type){
    case "mc": return plain(q.opts[a]);
    case "multi": return a.map(i => q.opts[i]).join(", ");
    case "order": return (a || p.start.map(i => q.items[i])).join(" | ");
    case "num": return String(a).trim();
    case "blank": return a.map(x => x || "-").join(" | ");
    case "bug": return U.line(a + 1);
    case "sql": return "\n      " + a.trim().replace(/\n/g, "\n      ");
  }
}
function report(){
  const L = [CFG.reportTitle, "", `${U.rName}: ${S.name}`, `${U.rStart}: ${new Date(S.started).toLocaleString(CFG.lang === "hu" ? "hu-HU" : "en-GB")}`,
    `${U.rTime}: ${mmss(S.finished - S.started)}`, `${U.rScore}: ${S.score} / ${maxPts()}`, ""];
  S.plan.forEach((pl, k) => { const { sec, q } = partOf(k);
    L.push(`${k + 1}. ${plain(sec.title)} [${q.id}] ${grade(k)}/${sec.pts}`, `   ${plain(q.q)}`, `   ${U.rAns}: ${answerText(k)}`, ""); });
  return L.join("\n");
}
function fileName(){ return `${CFG.filePrefix}-${S.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase() || "valasz"}.txt`; }
function saveTxt(){
  try { const b = new Blob([report()], { type: "text/plain;charset=utf-8" }), u = URL.createObjectURL(b), a = document.createElement("a");
    a.href = u; a.download = fileName(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1500);
    $("exNote").textContent = U.saved(fileName()); } catch(e){ $("exNote").textContent = U.saveBlocked; }
}
function copyTxt(){ navigator.clipboard.writeText(report()).then(() => $("exNote").textContent = U.copied, () => $("exNote").textContent = U.copyBlocked); }

/* ---------- tables ---------- */
function openTables(){
  const db = freshDb(); $("tablesH").textContent = U.tablesH;
  $("tablesBody").innerHTML = CFG.schema.tables.map(t => { const r = db.exec(`SELECT * FROM ${t.name}`)[0];
    return `<div class="dt"><h4>${t.name}<span>${U.rows(r.values.length)}</span></h4>${tableHtml(r)}</div>`; }).join("");
  db.close(); $("tables").showModal();
}
$("openTables").onclick = openTables;
$("tablesClose").onclick = () => $("tables").close();
$("tables").addEventListener("click", e => { if (e.target === $("tables")) $("tables").close(); });

/* ---------- boot ---------- */
if (typeof initSqlJs !== "function") $("main").innerHTML = `<div class="err">${U.engFail}</div>`;
else initSqlJs().then(s => { SQL = s;
  if (!S || !S.started || !S.plan) return startScreen();
  if (S.finished) return results();
  part(); clock();
}).catch(() => { $("main").innerHTML = `<div class="err">${U.engFail}</div>`; });
/* a second tab must not become a way back: follow whatever the other tab saved */
addEventListener("storage", e => { if (e.key !== KEY || !SQL) return; const n = load(); if (!n || !n.started) return;
  const moved = !S || !S.started || n.pos !== S.pos || (n.finished && !S.finished); S = n;
  if (!moved) return; if (S.finished){ clearInterval(clockT); results(); } else { part(); clock(); } });
</script>
<script src="../../nav.js" defer></script>
</body>
</html>
