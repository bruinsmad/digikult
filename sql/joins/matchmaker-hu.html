<style>
/* A teacher's projector demo, no code: tables as cards, links as wires.
   Each scene goes structure -> rows -> wires between rows; the arrow keys (or a presenter clicker) step through. */
:root{
  --night:#120d24; --night-2:#1d1438; --ink:#f3eefb; --muted:#b3a8cc; --line:#3a2d63; --card:#17112f; --card-h:#231a45;
  --pink:#ff4fa3; --cyan:#4fe3ff; --lime:#b8ff5c; --gold:#ffd166; --grey:#8f84ad;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs:clamp(13px, 1.05vw, 19px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
*,*::before,*::after{font-feature-settings:"calt" 0,"liga" 0}
html,body{margin:0}
body{color:var(--ink);font:16px/1.5 var(--f-body);min-height:100vh;
  background:radial-gradient(900px 420px at 15% -5%, rgba(255,79,163,.18), transparent 65%),radial-gradient(800px 420px at 85% 0%, rgba(79,227,255,.14), transparent 65%),linear-gradient(var(--night), var(--night-2));
  background-attachment:fixed;padding:16px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px))}
.wrap{max-width:1840px;margin:0 auto;display:grid;gap:16px}
h1,h2{font-family:var(--f-display);font-weight:800;margin:0;line-height:1.12;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.eyebrow{font:600 12px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.sign{display:flex;align-items:center;gap:14px;padding:12px 20px 12px 14px;background:linear-gradient(135deg,#ffffff,#f1ecff);color:#1a1230;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.45), inset 0 0 0 3px #fff, inset 0 0 0 5px #d8cff5}
.sign h1{font-size:clamp(24px,3.4vw,36px)}
.sign .eyebrow{color:#7a6aa6}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:700 15px var(--f-body);border:1px solid var(--line);background:#2a2050;color:var(--ink);padding:9px 15px;border-radius:8px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--pink)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#2b0a1b;box-shadow:0 3px 0 #a3235f}

/* scene tabs */
.scenes{display:flex;gap:8px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.scenes button{display:flex;align-items:center;gap:8px;font:700 15px var(--f-body);color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer}
.scenes button b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#2a2050;color:var(--ink);font:800 14px var(--f-display)}
.scenes button[aria-current="step"]{color:#fff;border-color:var(--pink);background:rgba(255,79,163,.14)}
.scenes button[aria-current="step"] b{background:var(--pink);color:#2b0a1b}
.scenes button:hover{color:#fff}

/* the stage: cards in a row, wires drawn on an svg laid over them */
.stage{position:relative;border-radius:18px;border:4px solid var(--line);background:#0b0817;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);background-size:32px 32px;
  min-height:clamp(380px, 54vh, 820px);padding:clamp(24px,3vw,48px) clamp(16px,3vw,48px);display:grid;align-items:center;overflow:hidden;box-shadow:0 16px 36px rgba(0,0,0,.5)}
.cards.n2{--fs:clamp(14px, 1.3vw, 24px)}
.cards{min-width:0;position:relative;z-index:1;display:flex;justify-content:center;align-items:flex-start;gap:clamp(70px, 9vw, 190px)}
#wires{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.45);min-width:0;flex:0 0 auto;
  animation:cardIn .45s ease-out both}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:10px 14px;background:var(--card-h);border-bottom:1.5px solid var(--line)}
.ch h2{font-size:clamp(18px,1.7vw,28px)}
.ch .rc{font:600 12px var(--f-mono);color:var(--muted);white-space:nowrap}

/* structure view: one line per column */
.cols{list-style:none;margin:0;padding:6px 0}
.cols li{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 12px;font:600 calc(var(--fs) * 1.08) var(--f-mono);color:var(--muted);border-left:5px solid transparent}
.cols li .ic{width:1.4em;text-align:center;font-size:.9em}
.cols li.link{color:#fff;border-left-color:var(--lc);background:color-mix(in srgb, var(--lc) 14%, transparent)}
.cols li.link .ic{color:var(--lc)}

/* rows view */
table{border-collapse:collapse;font:500 var(--fs)/1.3 var(--f-mono)}
th{font:700 calc(var(--fs) * .82) var(--f-mono);color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:7px 12px;white-space:nowrap;color:#e9e3f7;border-bottom:1px solid rgba(255,255,255,.05)}
tbody tr:last-child td{border-bottom:0}
th.link{color:var(--lc);box-shadow:inset 0 -3px 0 var(--lc)}
td.link{color:#fff;font-weight:700;background:color-mix(in srgb, var(--lc) 16%, transparent)}
td.num{text-align:right}
tbody tr{cursor:pointer;transition:opacity .2s, background .2s}
tbody tr:hover td{background-color:rgba(255,255,255,.06)}
td.cnt{padding-left:4px;width:1%}
td.cnt span{display:inline-block;min-width:2.1em;text-align:center;padding:1px 7px;border-radius:999px;background:var(--gold);color:#2a1f05;font:800 calc(var(--fs) * .8) var(--f-body);animation:pop .4s ease-out both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}

/* focus: one row and everything it is wired to */
.stage.focused tbody tr:not(.on){opacity:.22}
.stage.focused tbody tr.on td{background-color:rgba(255,209,102,.16)}
.stage.focused tbody tr.on.root td{background-color:rgba(255,209,102,.32)}

/* wires */
#wires path{fill:none;stroke-width:3;stroke-linecap:round;transition:opacity .2s, stroke-width .2s}
#wires path.row{stroke-width:2.4}
#wires path.cross{stroke:var(--grey);stroke-width:1.6;stroke-dasharray:5 6}
#wires path.cross.match{stroke:var(--pink);stroke-width:2.6;stroke-dasharray:none}
#wires.ruled path.cross:not(.match){opacity:.07}
#wires circle{transition:opacity .35s}
#wires text{font:800 clamp(16px,1.4vw,24px) var(--f-display);paint-order:stroke;stroke:#0b0817;stroke-width:5px}
.stage.focused #wires .w:not(.on){opacity:.06}
.stage.focused #wires path.on{stroke-width:4}

/* caption under the stage */
.cap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:center}
.cap .txt{min-height:4.2em}
.cap h2{font-size:clamp(20px,2vw,32px);margin-bottom:6px}
.cap p{margin:0;font:400 clamp(17px,1.55vw,25px)/1.45 var(--f-body);color:#ece6fa;max-width:72ch}
.cap p b{color:#fff}
.tn{font:700 .92em var(--f-mono);color:var(--gold)}
.cn{font:700 .92em var(--f-mono);color:var(--lc, var(--gold))}
.hint{margin-top:6px!important;font-size:clamp(14px,1.1vw,17px)!important;color:var(--muted)!important}
.nav{display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:#3a2d63}
.dots i.on{background:var(--pink)}
.dots i.done{background:#7a4a6a}
.nav .btn{font-size:17px;padding:11px 18px}


/* narrow screens: cards stack, wires loop round the side */
@media (max-width:820px){
  .stage{padding:22px 34px;min-height:0}
  .cards, .cards.n2{flex-direction:column;align-items:stretch;gap:40px;--fs:13px}
  .card{width:100%}
  .card .scroll{overflow-x:auto}
  .cols li{padding:5px 12px 5px 8px}
  #wires text{font-size:16px}
  .cap{grid-template-columns:minmax(0,1fr)}
  .nav{justify-content:space-between}
}
@media (prefers-reduced-motion: reduce){ .card, td.cnt span{animation:none} #wires path, tbody tr{transition:none} }
</style>
</head>

<div class="wrap">

<script>
const D = {"ui": {"rows": "{n} sor"}, "tables": {"bands": {"name": "zenekarok", "cols": ["id", "nev", "orszag"], "rows": [[1, "Paprika Punks", "Magyarország"], [2, "Danube Drift", "Magyarország"], [3, "Velvet Locomotive", "Egyesült Királyság"], [4, "Lady Lavender", "Ausztria"]]}, "stages": {"name": "szinpadok", "cols": ["id", "nev", "terulet"], "rows": [[1, "Nagyszínpad", "észak"], [2, "Táncpajta", "dél"]]}, "concerts": {"name": "koncertek", "cols": ["id", "zenekar_id", "szinpad_id", "nap", "kezdes"], "rows": [[1, 2, 1, "péntek", "20:00"], [2, 1, 2, "péntek", "21:00"], [3, 3, 1, "szombat", "22:00"], [4, 1, 1, "szombat", "18:00"], [5, 4, 2, "vasárnap", "19:00"], [6, 2, 2, "vasárnap", "17:00"]]}, "managers": {"name": "menedzserek", "cols": ["id", "nev", "zenekar_id"], "rows": [[1, "Kiss Réka", 3], [2, "Tóth Bence", 1], [3, "Nagy Eszter", 4], [4, "Szabó Máté", 2]]}}, "links": {"cb": {"from": "concerts", "col": "zenekar_id", "to": "bands", "color": "#ff4fa3", "gutter": "r"}, "cs": {"from": "concerts", "col": "szinpad_id", "to": "stages", "color": "#4fe3ff", "gutter": "l"}, "mb": {"from": "managers", "col": "zenekar_id", "to": "bands", "color": "#b8ff5c", "gutter": "r"}}, "scenes": [{"tab": "Hivatkozás", "title": "Egy szám, ami egy másik táblára mutat", "tables": ["concerts", "bands"], "links": ["cb"], "phases": [{"mode": "cols", "text": "A <span class=\"tn\">koncertek<\/span> táblában nincs zenekarnév. Helyette a <span class=\"cn\" style='--lc:#ff4fa3'>zenekar_id<\/span> oszlop mondja meg, <b>melyik zenekar<\/b> játszik: a <span class=\"tn\">zenekarok<\/span> tábla <span class=\"cn\" style='--lc:#ff4fa3'>id<\/span> oszlopára mutat."}, {"mode": "rows", "text": "Itt vannak a sorok. A <span class=\"cn\" style='--lc:#ff4fa3'>zenekar_id<\/span> oszlopban csak számok állnak – mindegyik egy zenekar <span class=\"cn\" style='--lc:#ff4fa3'>id<\/span>-je."}, {"mode": "rows", "lines": ["cb"], "animate": true, "text": "Minden koncertet összekötünk azzal a zenekarral, amelyiknek az <span class=\"cn\" style='--lc:#ff4fa3'>id<\/span>-je megegyezik a koncert <span class=\"cn\" style='--lc:#ff4fa3'>zenekar_id<\/span>-jével."}]}, {"tab": "Szabály nélkül", "title": "Mi lesz, ha nem mondjuk meg, mi tartozik össze?", "tables": ["concerts", "bands"], "links": ["cb"], "phases": [{"mode": "rows", "text": "Ugyanaz a két tábla. Most nem mondjuk meg, melyik koncert melyik zenekaré."}, {"mode": "rows", "lines": "cross", "animate": true, "text": "Ilyenkor <b>minden koncert párt kap minden zenekarral<\/b>: 6 × 4 = <b>24 pár<\/b>. A legtöbbjük értelmetlen – például a Velvet Locomotive koncertje a Paprika Punks nevével."}, {"mode": "rows", "lines": "cross", "rule": true, "animate": false, "text": "A <b>párosítási szabály<\/b> kiszűri a rossz párokat: csak az marad, ahol a koncert <span class=\"cn\" style='--lc:#ff4fa3'>zenekar_id<\/span>-je egyenlő a zenekar <span class=\"cn\" style='--lc:#ff4fa3'>id<\/span>-jével. <b>24 párból 6 marad<\/b> – minden koncerthez pontosan egy."}]}, {"tab": "Egy az egyhez", "title": "Minden zenekarnak pontosan egy menedzsere van", "tables": ["managers", "bands"], "links": ["mb"], "rel": {"mb": "1:1"}, "phases": [{"mode": "cols", "text": "A <span class=\"tn\">menedzserek<\/span> tábla <span class=\"cn\" style='--lc:#b8ff5c'>zenekar_id<\/span> oszlopa a <span class=\"tn\">zenekarok<\/span> tábla <span class=\"cn\" style='--lc:#b8ff5c'>id<\/span> oszlopára mutat."}, {"mode": "rows", "lines": ["mb"], "animate": true, "text": "Kössük össze a sorokat!"}, {"mode": "rows", "lines": ["mb"], "badges": ["managers", "bands"], "text": "<b>1 : 1<\/b> – minden zenekarhoz pontosan egy vonal fut, és minden menedzsertől is pontosan egy indul. Senki sem marad ki, és senkinek sincs kettő."}]}, {"tab": "Egy a többhöz", "title": "Egy zenekar – több koncert", "tables": ["bands", "concerts"], "links": ["cb"], "rel": {"cb": "N:1"}, "phases": [{"mode": "cols", "text": "Most a zenekar felől nézzük: a <span class=\"tn\">zenekarok<\/span> egy sorára (<b>1<\/b>) 1], "text": "A <b>Paprika Punks<\/b> két koncertet ad, két <b>különböző<\/b> színpadon: egy zenekar → több színpad."}, {"mode": "rows", "lines": ["cb", "cs"], "focus": ["stages", 1], "text": "A <b>Nagyszínpadon<\/b> három koncert van, három különböző zenekarral: egy színpad → több zenekar."}, {"mode": "rows", "lines": ["cb", "cs"], "text": "<b>N : N<\/b> – sok zenekar, sok színpad. Az ilyen kapcsolatot mindig egy köztes tábla tartja nyilván – itt a <span class=\"tn\">koncertek<\/span>."}]}]};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const NS = "http://www.w3.org/2000/svg";
let si = 0, pi = 0, focus = null, timers = [], renderToken = 0;

/* position lives in the address (#3-2) so a reload keeps the place */
(function(){ const m = location.hash.match(/^#(\d+)-(\d+)$/); if (m){ si = Math.min(D.scenes.length - 1, Math.max(0, m[1] - 1)); pi = Math.min(D.scenes[si].phases.length - 1, Math.max(0, m[2] - 1)); } })();

const scene = () => D.scenes[si], phase = () => scene().phases[pi];
const linkOf = k => D.links[k];
const colIdx = (t, c) => D.tables[t].cols.indexOf(c);

/* which link colours a column of a table in this scene */
function colLink(t, c){
  for (const k of scene().links){ const L = linkOf(k); if ((L.from === t && L.col === c) || (L.to === t && c === "id")) return L; }
  return null;
}

/* the row pairs a phase draws: [link key | "cross", fromTable, fromId, toTable, toId, match] */
function pairs(ph){
  const out = [];
  if (ph.lines === "cross"){
    const [a, b] = scene().tables, L = linkOf(scene().links[0]);
    const A = D.tables[L.from], ci = A.cols.indexOf(L.col);
    for (const r of A.rows) for (const s of D.tables[L.to].rows) out.push(["cross", L.from, r[0], L.to, s[0], r[ci] === s[0]]);
    return out;
  }
  for (const k of ph.lines || []){ const L = linkOf(k), ci = colIdx(L.from, L.col);
    for (const r of D.tables[L.from].rows) out.push([k, L.from, r[0], L.to, r[ci], true]); }
  return out;
}

/* rows reachable from one row, never stepping back into a table already reached */
function reach(t, id, P){
  const on = new Set([t + ":" + id]), seen = new Set([t]); let front = [[t, id]];
  while (front.length){ const next = [], hit = new Set();
    for (const [ft, fid] of front) for (const p of P){ if (!p[5]) continue;
      if (p[1] === ft && p[2] === fid && !seen.has(p[3])){ next.push([p[3], p[4]]); hit.add(p[3]); }
      if (p[3] === ft && p[4] === fid && !seen.has(p[1])){ next.push([p[1], p[2]]); hit.add(p[1]); } }
    hit.forEach(x => seen.add(x)); next.forEach(([a, b]) => on.add(a + ":" + b)); front = next; }
  return on;
}

function cardHtml(t, ph, P){
  const T = D.tables[t];
  const head = `<div class="ch"><h2>${esc(T.name)}</h2><span class="rc">${esc(D.ui.rows.replace("{n}", T.rows.length))}</span></div>`;
  if (ph.mode === "cols"){
    return `<div class="card" data-t="${t}">${head}<ul class="cols">${T.cols.map(c => { const L = colLink(t, c);
      const ic = c === "id" ? "🔑" : L ? "→" : "";
      return `<li data-c="${c}"${L ? ` class="link" style="--lc:${L.color}"` : ""}><span class="ic">${ic}</span>${esc(c)}</li>`; }).join("")}</ul></div>`;
  }
  const badge = (ph.badges || []).includes(t), count = id => P.filter(p => p[5] && ((p[3] === t && p[4] === id) || (p[1] === t && p[2] === id))).length;
  const th = T.cols.map(c => { const L = colLink(t, c); return `<th${L ? ` class="link" style="--lc:${L.color}"` : ""}>${esc(c)}</th>`; }).join("") + (badge ? "<th></th>" : "");
  const rows = T.rows.map(r => `<tr data-id="${r[0]}">${r.map((v, i) => { const L = colLink(t, T.cols[i]);
      return `<td class="${typeof v === "number" ? "num" : ""}${L ? " link" : ""}"${L ? ` style="--lc:${L.color}"` : ""}>${esc(v)}</td>`; }).join("")}${badge ? `<td class="cnt"><span style="animation-delay:${reduce ? 0 : (P.length * stagger(ph) + 150 + 0)}ms">${count(r[0])}×</span></td>` : ""}</tr>`).join("");
  return `<div class="card" data-t="${t}">${head}<div class="scroll"><table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
const stagger = ph => ph.animate ? (ph.lines === "cross" ? 45 : 260) : 0;

function render(animate = true){
  timers.forEach(clearTimeout); timers = [];
  const sc = scene(), ph = phase(), P = pairs(ph);
  history.replaceState(null, "", `#${si + 1}-${pi + 1}`);
  $("scenes").innerHTML = D.scenes.map((s, i) => `<li><button type="button" data-i="${i}"${i === si ? ' aria-current="step"' : ""}><b>${i + 1}</b>${esc(s.tab)}</button></li>`).join("");
  $("dots").innerHTML = sc.phases.map((_, i) => `<i class="${i === pi ? "on" : i < pi ? "done" : ""}"></i>`).join("");
  $("capTitle").textContent = sc.title;
  $("capText").innerHTML = ph.text;
  $("capHint").hidden = !(ph.mode === "rows" && ph.lines && ph.lines !== "cross");
  $("prev").disabled = si === 0 && pi === 0;
  $("next").disabled = si === D.scenes.length - 1 && pi === sc.phases.length - 1;
  $("cards").className = "cards n" + sc.tables.length;
  $("cards").innerHTML = sc.tables.map(t => cardHtml(t, ph, P)).join("");
  if (!animate) document.querySelectorAll(".card").forEach(c => c.style.animation = "none");
  focus = ph.focus ? { t: ph.focus[0], id: ph.focus[1] } : null;
  $("wires").innerHTML = ""; $("stage").classList.remove("focused");   /* old wires must not linger over the new cards */
  /* wires are measured from the cards, so wait until the cards have finished sliding in */
  const token = ++renderToken;
  requestAnimationFrame(() => { fit();
    const moving = [...document.querySelectorAll(".card")].flatMap(c => c.getAnimations ? c.getAnimations() : []);
    Promise.all(moving.map(a => a.finished.catch(() => {}))).then(() => { if (token === renderToken) draw(animate && !reduce); });
  });
}

/* keep every card whole: close the gaps first, then shrink the type until the row fits */
function fit(){
  const c = $("cards"); c.style.removeProperty("--fs"); c.style.removeProperty("gap");
  if (matchMedia("(max-width:820px)").matches) return;
  const over = () => c.scrollWidth > c.clientWidth + 1;
  if (!over()) return;
  c.style.gap = "56px";
  const probe = c.querySelector("td, li"); let fs = probe ? parseFloat(getComputedStyle(probe).fontSize) : 16;
  if (probe && probe.tagName === "LI") fs /= 1.08;
  while (over() && fs > 10){ fs -= .5; c.style.setProperty("--fs", fs + "px"); }
}
/* geometry: where a wire leaves a card and where it enters the other one */
function sides(a, b){
  if (b.left >= a.right - 2) return ["r", "l"];
  if (b.right <= a.left + 2) return ["l", "r"];
  return [null, null];          /* stacked: loop round the side */
}
function path(x1, y1, s1, x2, y2, s2, gutter){
  if (s1){ const c = Math.max(30, Math.abs(x2 - x1) / 2), d1 = s1 === "r" ? c : -c, d2 = s2 === "r" ? c : -c;
    return `M${x1} ${y1} C${x1 + d1} ${y1} ${x2 + d2} ${y2} ${x2} ${y2}`; }
  const g = gutter === "l" ? -30 : 30;
  return `M${x1} ${y1} C${x1 + g} ${y1} ${x2 + g} ${y2} ${x2} ${y2}`;
}
function el(name, attrs, parent){ const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }

function draw(animate){
  const svg = $("wires"); svg.innerHTML = "";
  const ph = phase(), sc = scene(), base = $("stage").getBoundingClientRect();
  const card = t => document.querySelector(`.card[data-t="${t}"]`);
  const R = e => { const r = e.getBoundingClientRect(); return { left: r.left - base.left, right: r.right - base.left, top: r.top - base.top, bottom: r.bottom - base.top, mid: (r.top + r.bottom) / 2 - base.top }; };
  const ends = (ta, ea, tb, eb, gutter) => {
    const A = R(card(ta)), B = R(card(tb)), [s1, s2] = sides(A, B), ra = R(ea), rb = R(eb);
    const x1 = s1 ? (s1 === "r" ? A.right : A.left) : (gutter === "l" ? A.left : A.right), x2 = s2 ? (s2 === "r" ? B.right : B.left) : (gutter === "l" ? B.left : B.right);
    return { x1, y1: ra.mid, x2, y2: rb.mid, d: path(x1, ra.mid, s1, x2, rb.mid, s2, gutter), s1, s2 };
  };
  const grow = (p, delay) => { if (!animate) return; const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    p.getBoundingClientRect(); p.style.transition = `stroke-dashoffset .55s ease-in-out ${delay}ms, opacity .35s`; p.style.strokeDashoffset = 0;
    timers.push(setTimeout(() => { p.style.strokeDasharray = ""; p.style.transition = ""; }, delay + 650)); };
  const fade = (n, delay) => { if (!animate) return; n.style.opacity = 0; n.style.transition = `opacity .3s ${delay}ms`; n.getBoundingClientRect(); n.style.opacity = "";
    timers.push(setTimeout(() => { n.style.transition = ""; }, delay + 400)); };   /* drop the delay so later dimming is instant */

  if (ph.mode === "cols"){
    sc.links.forEach((k, i) => { const L = linkOf(k), a = card(L.from), b = card(L.to); if (!a || !b) return;
      const e = ends(L.from, a.querySelector(`li[data-c="${L.col}"]`), L.to, b.querySelector('li[data-c="id"]'), L.gutter);
      const p = el("path", { d: e.d, stroke: L.color, class: "w" }, svg); grow(p, 250 + i * 500);
      [[e.x1, e.y1], [e.x2, e.y2]].forEach(([x, y]) => fade(el("circle", { cx: x, cy: y, r: 6, fill: L.color }, svg), 250 + i * 500));
      const [n1, n2] = (sc.rel && sc.rel[k] || "N:1").split(":");
      const lab = (x, y, s, t) => { const dx = s === "l" ? -16 : 16; const tx = el("text", { x: x + dx, y: y - 12, fill: L.color, "text-anchor": s === "l" ? "end" : "start" }, svg); tx.textContent = t; fade(tx, 700 + i * 500); };
      lab(e.x1, e.y1, e.s1 || L.gutter || "r", n1); lab(e.x2, e.y2, e.s2 || L.gutter || "r", n2);
    });
    return;
  }
  if (!ph.lines) return;
  const P = pairs(ph), st = stagger(ph);
  P.forEach((p, i) => {
    const L = p[0] === "cross" ? null : linkOf(p[0]);
    const a = card(p[1]), b = card(p[3]); if (!a || !b) return;
    const ra = a.querySelector(`tbody tr[data-id="${p[2]}"]`), rb = b.querySelector(`tbody tr[data-id="${p[4]}"]`); if (!ra || !rb) return;
    const e = ends(p[1], ra, p[3], rb, L ? L.gutter : "r");
    const cls = p[0] === "cross" ? "w cross" + (p[5] && ph.rule ? " match" : "") : "w row";
    const node = el("path", { d: e.d, class: cls, "data-a": p[1] + ":" + p[2], "data-b": p[3] + ":" + p[4] }, svg);
    if (L) node.setAttribute("stroke", L.color);
    if (p[0] === "cross") fade(node, i * st); else grow(node, 150 + i * st);
    if (L) [[e.x1, e.y1], [e.x2, e.y2]].forEach(([x, y]) => { const c = el("circle", { cx: x, cy: y, r: 4.5, fill: L.color, class: "w", "data-a": p[1] + ":" + p[2], "data-b": p[3] + ":" + p[4] }, svg); fade(c, 150 + i * st); });
  });
  if (ph.lines === "cross" && ph.rule){ svg.classList.add("ruled"); } else svg.classList.remove("ruled");
  if (ph.lines === "cross" && ph.rule && animate){ svg.classList.remove("ruled"); timers.push(setTimeout(() => svg.classList.add("ruled"), 500)); }
  applyFocus(P, animate ? 150 + P.length * st : 0);
}

function applyFocus(P, delay = 0){
  const go = () => {
    const f = focus;
    const stage = $("stage"); stage.classList.toggle("focused", !!f);
    document.querySelectorAll("tbody tr").forEach(tr => tr.classList.remove("on", "root"));
    document.querySelectorAll("#wires .w").forEach(w => w.classList.remove("on"));
    if (!f) return;
    const on = reach(f.t, f.id, P);
    document.querySelectorAll(".card").forEach(c => c.querySelectorAll("tbody tr").forEach(tr => {
      const key = c.dataset.t + ":" + tr.dataset.id; if (on.has(key)) tr.classList.add("on"); if (key === f.t + ":" + f.id) tr.classList.add("root"); }));
    document.querySelectorAll("#wires .w").forEach(w => { if (on.has(w.dataset.a) && on.has(w.dataset.b)) w.classList.add("on"); });
  };
  if (delay) timers.push(setTimeout(go, delay)); else go();
}

function go(dir){
  const sc = scene();
  if (dir > 0){ if (pi < sc.phases.length - 1) pi++; else if (si < D.scenes.length - 1){ si++; pi = 0; } else return; }
  else { if (pi > 0) pi--; else if (si > 0){ si--; pi = D.scenes[si].phases.length - 1; } else return; }
  render(true);
}
$("next").onclick = () => go(1);
$("prev").onclick = () => go(-1);
$("replay").onclick = () => render(true);
$("full").onclick = () => { const d = document; if (d.fullscreenElement) d.exitFullscreen(); else d.documentElement.requestFullscreen && d.documentElement.requestFullscreen(); };
$("scenes").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (!b) return; si = +b.dataset.i; pi = 0; render(true); });
$("cards").addEventListener("click", e => {
  const tr = e.target.closest("tbody tr"), ph = phase(); if (!ph.lines || ph.lines === "cross" && !ph.rule) return;
  if (!tr){ focus = null; applyFocus(pairs(ph)); return; }
  const t = tr.closest(".card").dataset.t, id = +tr.dataset.id;
  focus = focus && focus.t === t && focus.id === id ? null : { t, id }; applyFocus(pairs(ph));
});
addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey || /input|textarea|select/i.test(e.target.tagName)) return;
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key) && !(e.key === "Enter" && e.target.tagName === "BUTTON")){ e.preventDefault(); go(1); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)){ e.preventDefault(); go(-1); }
  else if (e.key === "r" || e.key === "R") render(true);
  else if (e.key === "f" || e.key === "F") $("full").click();
  else if (e.key === "Escape" && focus){ focus = null; applyFocus(pairs(phase())); }
});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { fit(); draw(false); }, 120); });
if (document.fonts && document.fonts.status !== "loaded") document.fonts.ready.then(() => { fit(); draw(false); });
render(true);
</script>
